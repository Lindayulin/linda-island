<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情報布告欄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=IM+Fell+English&display=swap">
<style>
/* Layout: top strip (title, scheme tabs, date + search) above one stage; the stage shows one of three rough concepts (cork board / tabletop / treasure map), all sharing the same report data and the same pop-up reader. Single warm paper look on purpose. */
:root{
  --wall:#ece4d4;
  --ink:#2f3a44;
  --ink-soft:#6a6358;
  --paper:#fffdf6;
  --wood:#a8733f;
  --wood-dark:#7a5032;
  --parch:#efdcb3;
  --parch-edge:#b8915a;
  --red:#d2453a;
  --round:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--round);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.title{display:flex;align-items:center;gap:12px;min-width:0}
.mino{width:44px;height:44px;border-radius:14px;background:#e2cd96;display:grid;place-items:center;font-size:13px;color:#5a4426;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);flex:none}
.title h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.04em;line-height:1.2}
.say{margin:0;font-size:13px;color:var(--ink-soft)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.datebox{display:flex;align-items:center;background:var(--paper);border-radius:999px;box-shadow:0 2px 6px rgba(60,40,20,.12);overflow:hidden}
.datebox button{font:inherit;border:0;background:none;color:var(--ink);padding:7px 12px;cursor:pointer}
.datebox button:disabled{opacity:.3;cursor:default}
.datebox b{font-weight:400;font-variant-numeric:tabular-nums;min-width:8.5em;text-align:center}
.pill{font:inherit;font-size:13px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);padding:7px 14px;cursor:pointer}
.search{font:inherit;border:0;border-radius:999px;padding:7px 14px;background:var(--paper);box-shadow:0 2px 6px rgba(60,40,20,.12);width:190px;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{font:inherit;font-size:14px;border:1px solid rgba(60,40,20,.18);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--wood-dark);color:var(--paper);border-color:var(--wood-dark)}

.stage{position:relative}
svg.scene{display:block;width:100%;height:auto;max-width:100%}
.hot{cursor:pointer;transition:transform .15s ease;transform-box:fill-box;transform-origin:center}
.hot:hover,.hot:focus-visible{transform:scale(1.05) translateY(-4px)}
.hot:focus{outline:none}
.hot:focus-visible .ring{stroke:#2f6fb0;stroke-width:5}
.hot.off{cursor:default;opacity:.55}
.hot.off:hover{transform:none}
.lbl{font-family:var(--round);fill:#3a2a1a}

/* 布告欄（原本） */
.board{background:#c9a273;
  background-image:radial-gradient(rgba(90,55,25,.25) 1px,transparent 1.6px),radial-gradient(rgba(255,240,210,.22) 1px,transparent 1.8px);
  background-size:9px 9px,13px 13px;border:14px solid var(--wood);border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--wood-dark),inset 0 6px 18px rgba(60,30,10,.35),0 10px 24px rgba(60,40,20,.25);padding:26px 20px 26px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.note{position:relative;border:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:28px 18px 18px;min-height:230px;
  box-shadow:0 12px 16px -6px rgba(50,30,10,.4);transition:transform .15s ease;background:var(--c);display:flex;flex-direction:column;gap:6px;width:100%}
.note:hover{transform:rotate(0deg) translateY(-4px) scale(1.02)!important}
.note.off{opacity:.7;cursor:default}.note.off:hover{transform:none!important}
.note .flag{font-size:28px;line-height:1}.note .mk{font-size:24px;line-height:1.2}
.note .cnt{font-size:14px;color:rgba(40,30,20,.65)}
.note ul{margin:6px 0 0;padding:10px 0 0;list-style:none;display:grid;gap:5px;border-top:1px dashed rgba(40,30,20,.25)}
.note li{font-size:13.5px;line-height:1.45;word-break:break-word}
.note .more{margin-top:auto;padding-top:8px;font-size:13px;color:rgba(40,30,20,.6)}
.pin{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,var(--red) 55%,#8e2219);box-shadow:0 3px 4px rgba(0,0,0,.35)}

.hint{font-size:13px;color:var(--ink-soft);text-align:center;margin:0}
.foot{font-size:12px;color:var(--ink-soft);text-align:center;margin:0}

/* Info Hub 03：石牆＋木板公告欄 */
.hub{position:relative;padding:34px 30px 40px;border-radius:6px;overflow:hidden;
  background-color:#6d7178;
  background-image:
    linear-gradient(rgba(0,0,0,.28) 2px,transparent 2px),
    linear-gradient(90deg,rgba(0,0,0,.28) 2px,transparent 2px),
    linear-gradient(90deg,rgba(0,0,0,.28) 2px,transparent 2px),
    radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);
  background-size:72px 40px,72px 40px,72px 40px,7px 7px;
  background-position:0 0,0 0,36px 20px,0 0;
  box-shadow:inset 0 0 60px rgba(0,0,0,.45)}
.planks{position:relative;border-radius:4px;padding:26px 22px 30px;
  background:
    repeating-linear-gradient(180deg,transparent 0 62px,rgba(60,30,10,.55) 62px 64px),
    repeating-linear-gradient(90deg,rgba(255,220,170,.06) 0 3px,transparent 3px 11px),
    linear-gradient(180deg,#c48a4f,#a8703b 40%,#b67c44 70%,#9c6633);
  box-shadow:0 16px 30px rgba(0,0,0,.45),inset 0 0 0 4px #7a4c25,inset 0 0 30px rgba(60,30,10,.35);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px}
.bolt{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9aa0a6,#4a4f55 70%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.post{position:relative;border:0;font:inherit;color:#3a2a1a;text-align:left;cursor:pointer;padding:30px 20px 22px;min-height:250px;
  background:#efdcb3;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(140,90,40,.25),transparent 55%);
  clip-path:polygon(2% 3%,12% 0,24% 2%,38% 0,52% 3%,66% 0,80% 2%,94% 0,99% 4%,97% 18%,100% 34%,97% 50%,100% 66%,98% 82%,100% 97%,86% 100%,70% 97%,54% 100%,38% 97%,22% 100%,8% 97%,0 99%,2% 82%,0 66%,3% 50%,0 34%,2% 18%);
  filter:drop-shadow(0 8px 8px rgba(40,20,5,.45));transition:transform .15s ease;display:flex;flex-direction:column;gap:6px}
.post:hover{transform:rotate(0deg) translateY(-4px) scale(1.02)!important}
.post.off{cursor:default;opacity:.75}.post.off:hover{transform:none!important}
.post .eng{font-family:"IM Fell English",Georgia,serif;font-size:15px;letter-spacing:.18em;color:#6b4a2e;text-transform:uppercase}
.post .ttl{font-size:28px;line-height:1.15;letter-spacing:.06em}
.post .cnt{font-size:14px;color:#6b4a2e}
.post ul{margin:8px 0 0;padding:10px 0 0;list-style:none;display:grid;gap:6px;border-top:2px dotted rgba(90,60,30,.35)}
.post li{font-size:13.5px;line-height:1.5;word-break:break-word}
.post .more{margin-top:auto;padding-top:10px;font-size:13px;color:#6b4a2e}
.nail{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9ccd0,#55595e 70%);box-shadow:0 2px 2px rgba(0,0,0,.45)}
.stamp{position:absolute;right:14px;top:14px;border:3px solid #b8342a;color:#b8342a;border-radius:6px;padding:0 8px;font-size:14px;transform:rotate(8deg);opacity:.85;font-family:"IM Fell English",Georgia,serif;letter-spacing:.08em}
.deco{position:absolute;pointer-events:none}
.ivy{left:-6px;top:20px;bottom:20px;width:46px;
  background:radial-gradient(circle at 60% 10%,#4f8a3c 8px,transparent 9px),radial-gradient(circle at 30% 22%,#5e9e45 9px,transparent 10px),radial-gradient(circle at 70% 35%,#4f8a3c 8px,transparent 9px),
    radial-gradient(circle at 35% 48%,#5e9e45 9px,transparent 10px),radial-gradient(circle at 65% 62%,#4f8a3c 8px,transparent 9px),radial-gradient(circle at 30% 76%,#5e9e45 9px,transparent 10px),
    radial-gradient(circle at 60% 90%,#4f8a3c 8px,transparent 9px),radial-gradient(circle at 55% 30%,#d65a9a 4px,transparent 5px),radial-gradient(circle at 45% 70%,#d65a9a 4px,transparent 5px)}
.tag{position:absolute;background:#efe6d2;color:#4a3a28;font-size:13px;padding:6px 10px;transform:rotate(-4deg);box-shadow:0 4px 6px rgba(0,0,0,.35);line-height:1.4}
.rope{width:64px;height:64px;border-radius:50%;border:8px double #d9c7a0;box-shadow:0 4px 6px rgba(0,0,0,.4)}
.hub .say2{position:absolute;right:26px;bottom:8px;color:#f3ead8;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
@media (max-width:820px){.planks{grid-template-columns:minmax(0,1fr)}.post{min-height:0}.hub{padding:24px 14px 34px}.tag,.rope{display:none}}

.t3{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#5a3a22,#3a2414);box-shadow:0 10px 24px rgba(60,40,20,.25)}
.t3 canvas{display:block;width:100%;touch-action:pan-y}
.t3bub{position:absolute;transform:translate(-50%,-100%);background:rgba(255,253,246,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);font-size:15px;padding:8px 14px;border-radius:14px;box-shadow:0 6px 14px rgba(60,40,20,.15);border:1px solid rgba(255,255,255,.5);pointer-events:none;width:max-content;max-width:230px;text-align:center}
.t3bub::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:rgba(255,253,246,.62);transform:translateX(-50%) rotate(45deg)}
.t3tip{position:absolute;transform:translate(-50%,-100%);background:rgba(70,70,70,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:4px 11px;border-radius:8px;pointer-events:none;white-space:nowrap}
.t3fail{padding:40px 16px;text-align:center;background:var(--paper);border-radius:14px}
.arbox{--c:#f3e6c8;font-family:var(--round)}
#arc{position:fixed;inset:0;z-index:21;background:rgba(40,28,15,.45);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.arsearch{display:flex;gap:8px;margin:0 0 12px}
.arsearch input{flex:1;min-width:0;font:inherit;border:1px solid rgba(60,40,20,.2);border-radius:999px;padding:8px 14px;background:#fffdf6;color:var(--ink)}
.arsearch button{font:inherit;border:0;border-radius:999px;padding:8px 16px;background:var(--wood-dark);color:#fff;cursor:pointer}
.arlist{display:grid;gap:8px}
.arrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:inherit;text-align:left;border:0;border-radius:12px;background:rgba(255,255,255,.6);padding:10px 14px;cursor:pointer;color:var(--ink)}
.arrow:hover{background:#fff}
.arrow b{font-weight:400;font-size:16px}
.archips{display:flex;gap:6px}
.archips i{font-style:normal;font-size:13px;background:rgba(107,74,46,.12);border-radius:999px;padding:1px 9px}
.t3bub{transition:opacity .2s ease}.t3bub.fade{opacity:0}
.back{font:inherit;font-size:14px;text-decoration:none;color:var(--paper);background:var(--wood-dark);border-radius:999px;padding:7px 14px;box-shadow:0 2px 6px rgba(60,40,20,.2);white-space:nowrap}
.back:hover{filter:brightness(1.1)}
.top{justify-content:flex-start}
#fade{position:fixed;inset:0;background:#2a1a10;z-index:50;pointer-events:none;opacity:0;transition:opacity .45s ease}
#fade.on{opacity:1}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wrap{animation:fadeIn .6s ease}
/* 滿版：3D 書房填滿整個畫面，左上角放「回到小島」和標題 */
html,body{height:100%}
body{padding:0!important;overflow:hidden}
.wrap{position:fixed;inset:0;max-width:none;margin:0;display:block}
.stage{position:absolute;inset:0}
.t3{position:absolute;inset:0;border-radius:0!important;box-shadow:none!important}
.top{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));right:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.title{background:rgba(255,253,246,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:16px;padding:6px 14px 6px 8px;box-shadow:0 4px 12px rgba(40,25,10,.18)}
.title h1{font-size:18px}
.mino{width:36px;height:36px;font-size:11px;border-radius:11px}
@media (max-width:560px){.say{display:none}.title h1{font-size:16px}}
.t3bub.side{transform:translate(-100%,-50%);font-size:13px;line-height:1.45;padding:7px 11px;max-width:150px}
.t3bub.side::after{left:auto;right:-6px;bottom:auto;top:50%;transform:translateY(-50%) rotate(45deg)}
@media (max-width:560px){.top{gap:6px}.title{padding:4px 10px 4px 6px}.mino{width:28px;height:28px;font-size:9px}.title h1{font-size:15px}.back{font-size:13px;padding:6px 11px}#bgmBtn{font-size:13px;padding:6px 10px}}
/* 讀報告的視窗 */
#view{position:fixed;inset:0;z-index:20;background:rgba(40,28,15,.45);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.big{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--c);padding:30px 24px 20px;box-shadow:0 24px 40px rgba(30,20,10,.45);border-radius:4px;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.88);opacity:.5}to{transform:none;opacity:1}}
.big .kind{font-size:13px;color:rgba(40,30,20,.6)}
.big h2{margin:4px 0 12px;font-size:20px;font-weight:400;line-height:1.45}
.items{display:grid;gap:12px}
.item{background:rgba(255,255,255,.55);border-radius:10px;padding:12px 14px}
.item .d{font-size:12px;color:rgba(40,30,20,.6)}
.item h3{margin:2px 0 4px;font-size:16px;font-weight:400;line-height:1.5}
.item p{margin:0;white-space:pre-line;font-size:15px;line-height:1.8}
.big .disc{margin:16px 0 0;font-size:12px;color:rgba(40,30,20,.6)}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.6);font-size:20px;cursor:pointer;color:var(--ink);font-family:var(--round)}
:focus-visible{outline:3px solid #2f6fb0;outline-offset:2px}

@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}.note{min-height:0}}
@media (max-width:560px){.search{width:100%}.ctrl{width:100%}.title h1{font-size:19px}.board{border-width:10px;padding:20px 12px}}
@media (prefers-reduced-motion:reduce){.hot,.note{transition:none}.big{animation:none}}
</style>

<div class="wrap">
  <div class="top">
    <a class="back" id="backIsland" href="island.html">← 回到小島</a>
    <div class="title">
      <div class="mino" aria-hidden="true">米諾</div>
      <div><h1>資訊情報站</h1><p class="say" id="say"></p></div>
    </div>
    <div class="ctrl" hidden>
      <div class="datebox">
        <button type="button" id="prev" aria-label="前一天">◀</button>
        <b id="dateLabel"></b>
        <button type="button" id="next" aria-label="後一天">▶</button>
      </div>
      <button type="button" class="pill" id="toToday">回到今天</button>
      <input class="search" id="q" type="search" placeholder="搜尋公司、代號或產業" aria-label="搜尋報告">
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="方案" hidden>
    <button type="button" role="tab" data-v="A" aria-selected="true">方案 A・3D 桌遊</button>
    <button type="button" role="tab" data-v="B" aria-selected="false">方案 B・藏寶圖</button>
    <button type="button" role="tab" data-v="H" aria-selected="false">Info Hub 03・公告板</button>
  </div>

  <div class="stage" id="stage"></div>
  <p class="hint" id="hint" hidden></p>
</div>

<div id="fade"></div>
<div id="arc" hidden role="dialog" aria-modal="true" aria-labelledby="arH">
  <div class="big arbox">
    <button class="x" id="arX" type="button" aria-label="關閉">×</button>
    <div class="kind">ARCHIVE</div>
    <h2 id="arH">📖 情報檔案冊</h2>
    <form id="arGo" class="arsearch"><input id="arQ" type="search" placeholder="搜尋公司、代號或產業" aria-label="搜尋過往報告"><button type="submit">搜尋</button></form>
    <div class="arlist" id="arList"></div>
    <p class="disc">點日期，牆上的公告就會換成那一天的情報。</p>
  </div>
</div>
<div id="view" hidden role="dialog" aria-modal="true" aria-labelledby="vH">
  <div class="big" id="big">
    <button class="x" id="vX" type="button" aria-label="關閉">×</button>
    <div class="kind" id="vK"></div>
    <h2 id="vH"></h2>
    <div class="items" id="vB"></div>
    <p class="disc">※ 以上為研究報告摘要翻譯，不構成投資建議</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const MARKETS = [
  {k:'日本', flag:'🇯🇵', c:'#f7c6cf', dark:'#c9566e'},
  {k:'韓國', flag:'🇰🇷', c:'#c6dcf5', dark:'#3f6fb5'},
  {k:'美國', flag:'🇺🇸', c:'#cfe8c4', dark:'#3f8a4f'}
];
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const T=new Date(); T.setHours(0,0,0,0);
const day=function(n){ const d=new Date(T); d.setDate(d.getDate()-n); return iso(d); };
const DATA={};
DATA[day(0)]=[
  {m:'日本', h:'〔範例精機（0000.JP），買進，目標價：XX（↑8%）〕', b:'（範例）分析師認為設備訂單回溫，上調今明兩年 EPS 預估。\n公司在先進封裝的市占持續提升，維持買進評等。'},
  {m:'日本', h:'〔產業：半導體設備〕', b:'（範例）日本設備商第三季接單優於預期，主要受惠於 HBM 與先進製程投資。'},
  {m:'韓國', h:'〔範例半導體（000000），買進，目標價：W XX〕', b:'（範例）記憶體報價續揚，HBM 出貨比重提高，分析師看好下半年獲利。'},
  {m:'韓國', h:'〔產業：造船〕', b:'（範例）LNG 船訂單持續，造船族群獲利能見度高。'},
  {m:'美國', h:'〔範例科技（XXXX.US），優於大盤，目標價：XX〕', b:'（範例）雲端業務成長加速，ARR 與 NRR 皆優於預期。'},
  {m:'美國', h:'〔總經：Fed 利率展望〕', b:'（範例）市場預期年底前再降息一碼的機率上升。'},
  {m:'美國', h:'〔產業：AI 伺服器供應鏈〕', b:'（範例）整理各家外資對 AI 伺服器供應鏈的看法重點。'}
];

function fmt(s){ const d=new Date(s+'T00:00:00'); return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日一二三四五六'[d.getDay()]+'）'; }

function current(){

  if(q){ const out=[]; Object.keys(DATA).sort().reverse().forEach(function(d){ DATA[d].forEach(function(n){ if((n.h+n.b+n.m).toLowerCase().indexOf(q)>=0) out.push(Object.assign({d:d},n)); }); }); return out; }

}
function byMarket(items, k){ return items.filter(function(n){ return n.m===k; }); }

/* ---------- 共用：讀報告視窗 ---------- */
let lastFocus=null;
function openList(m, list){
  if(!list.length) return;
  lastFocus=document.activeElement;
  $('big').style.setProperty('--c', m.c);
  $('vK').textContent = searching() ? '搜尋結果' : fmt(day(cur));
  $('vH').textContent = m.flag+' '+m.k+'・'+list.length+' 則情報';
  const box=$('vB'); box.innerHTML='';
  list.forEach(function(n){
    const it=document.createElement('div'); it.className='item';
    if(n.d){ const d=document.createElement('div'); d.className='d'; d.textContent=fmt(n.d); it.appendChild(d); }
    const h=document.createElement('h3'); h.textContent=n.h; it.appendChild(h);
    const p=document.createElement('p'); p.textContent=n.b; it.appendChild(p);
    box.appendChild(it);
  });
  $('view').hidden=false; $('vX').focus();
}
function closeList(){ $('view').hidden=true; if(lastFocus) lastFocus.focus(); }
$('vX').addEventListener('click', closeList);
$('view').addEventListener('click', function(e){ if(e.target===$('view')) closeList(); });
window.addEventListener('keydown', function(e){ if(e.key==='Escape' && !$('view').hidden) closeList(); });

/* ---------- SVG 小工具 ---------- */
function S(tag, attrs, parent){ const e=document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function txt(parent, x, y, s, size, extra){ const t=S('text', Object.assign({x:x, y:y, 'font-size':size, 'text-anchor':'middle', class:'lbl'}, extra||{}), parent); t.textContent=s; return t; }
function hot(parent, m, list, label){
  const g=S('g', {class:'hot'+(list.length?'':' off'), tabindex:list.length?'0':'-1', role:'button', 'aria-label':label}, parent);
  if(list.length){
    g.addEventListener('click', function(){ openList(m, list); });
    g.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openList(m, list); } });
  }
  return g;
}
function rng(seed){ return function(){ seed=(seed*16807)%2147483647; return seed/2147483647; }; }

function blob(cx, cy, rx, ry, seed){
  const R=rng(seed), n=14; let d='';
  for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2, k=.82+R()*.3, x=cx+Math.cos(a)*rx*k, y=cy+Math.sin(a)*ry*k; d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1); }
  return d+' Z';
}

    mino.arms[0].rotation.x += (restX-mino.arms[0].rotation.x)*.12; mino.arms[0].rotation.z += (-restZ-mino.arms[0].rotation.z)*.12;
    if(waveT>0){ waveT-=dt; mino.arms[1].rotation.x += (0-mino.arms[1].rotation.x)*.25; mino.arms[1].rotation.z += ((.42+2.3)-mino.arms[1].rotation.z)*.25; mino.arms[1].rotation.y=Math.sin(t*14)*.3*m; }
    else { mino.arms[1].rotation.x += (restX-mino.arms[1].rotation.x)*.12; mino.arms[1].rotation.z += (restZ-mino.arms[1].rotation.z)*.12; mino.arms[1].rotation.y=0; }
    notices.forEach(function(nt,i){ const tg=(hoverHot==='main')?1:0; nt.lift+=(tg-nt.lift)*.2; nt.mesh.position.z=nt.base.z+nt.lift*.08; nt.mesh.scale.setScalar(1+nt.lift*.08); });
    flick.forEach(function(f){ const k=1+(Math.sin(t*9+f.ph)*.05+Math.sin(t*23+f.ph*2)*.03)*m; f.L.intensity=f.base*k; if(f.fl) f.fl.scale.set(1,k*1.05,1); });
    gball.rotation.y += .004*m;
    if(m){ lineT-=dt; if(lineT<0){ lineT=4.5; lineI++; showLine(); } }
    v.set(BASE.x+mx*.6*m, BASE.y-my*.3*m, BASE.z); camera.position.lerp(v,.06); camera.lookAt(LOOK);
    renderer.render(scene, camera);
    const W=box.clientWidth, Hh=box.clientHeight, side = W/Hh < .75;
    bubble.classList.toggle('side', side);
    if(side){
      // 手機直式：泡泡放在米諾頭的左邊，不擋住公告板
      v.set(1.95,(mino.hY+.15)*1.05,-.75).project(camera);
      const hx=(v.x+1)/2*W, hy=(1-v.y)/2*Hh;
      bubble.style.left=Math.max((bubble.offsetWidth||160)+10, hx-34)+'px'; bubble.style.top=hy+'px';
    } else {
      v.set(1.95,(mino.hY+.82)*1.05,-.75).project(camera);
      const bw=bubble.offsetWidth||200; bubble.style.left=Math.max(bw/2+10, Math.min(W-bw/2-10, (v.x+1)/2*W))+'px'; bubble.style.top=((1-v.y)/2*Hh)+'px';
    }
    requestAnimationFrame(tick);
  }
  return {
    el: box,
    update: function(items, say){
      if(!sayText){ sayText='set'; lines=['歡迎來到資訊情報站！我是情報員米諾。','日本、韓國、美國的最新消息，我都幫你整理好了！','點牆上中間的公告，就能看最新的報告摘要喔。','我剛出差回來，旅行箱還沒整理完……','今天的咖啡好像還不夠濃……']; lineI=0; lineT=4.5; bubble.textContent=lines[0]; }
    },
    start: function(){ if(running) return; running=true; size(); clock.getDelta(); tick(); },
    stop: function(){ running=false; }
  };
})();


/* ---------- 情報檔案冊（過往報告） ---------- */
function openArchive(){
  lastFocus=document.activeElement;
  const list=$('arList'); list.innerHTML='';
  const days=Object.keys(DATA).sort().reverse();
  days.forEach(function(d){
    const b=document.createElement('button'); b.type='button'; b.className='arrow';
    const dd=document.createElement('b'); dd.textContent=fmt(d); b.appendChild(dd);
    const ch=document.createElement('span'); ch.className='archips';
    MARKETS.forEach(function(m){ const n=DATA[d].filter(function(x){ return x.m===m.k; }).length; if(!n) return; const c=document.createElement('i'); c.textContent=m.flag+' '+n; ch.appendChild(c); });
    b.appendChild(ch);
    b.addEventListener('click', function(){ const idx=Math.round((new Date(day(0)+'T00:00:00')-new Date(d+'T00:00:00'))/86400000); cur=idx; $('q').value=''; closeArchive(); render(); });
    list.appendChild(b);
  });
  $('arQ').value=$('q').value;
  $('arc').hidden=false; $('arX').focus();
}
function closeArchive(){ $('arc').hidden=true; if(lastFocus) lastFocus.focus(); }
$('arX').addEventListener('click', closeArchive);
$('arc').addEventListener('click', function(e){ if(e.target===$('arc')) closeArchive(); });
window.addEventListener('keydown', function(e){ if(e.key==='Escape' && !$('arc').hidden) closeArchive(); });
$('arGo').addEventListener('submit', function(e){ e.preventDefault(); $('q').value=$('arQ').value; closeArchive(); render(); });

/* ---------- 畫面更新 ---------- */
const HINT={A:'點牆上的國旗公告看各市場的報告摘要；滑鼠移到東西上會出現小說明，點米諾可以跟他聊天。',B:'點三座情報島上的寶箱，看各市場的報告摘要；放大鏡可以搜尋。',H:'點木板上的公告，看各市場的報告摘要。'};
function render(){
  const items=current(), srch=searching();
  $('dateLabel').textContent = srch ? '搜尋結果' : fmt(day(cur));
  $('say').textContent = srch ? '米諾：找到 '+items.length+' 則和「'+$('q').value.trim()+'」有關的情報。'
    : (items.length ? '米諾：'+(cur===0?'今天':'這一天')+'收到 '+items.length+' 則情報！' : '米諾：'+(cur===0?'今天的情報還在路上喔！':'這一天沒有情報。'));
  $('prev').disabled = srch || cur>=MAXBACK; $('next').disabled = srch || cur===0;
  $('toToday').hidden = !srch && cur===0;
  const st=$('stage'); st.innerHTML='';
  if(T3) T3.stop();
  if(view==='A'){
    if(T3){ T3.update(items, $('say').textContent.replace(/^米諾：/,'')); st.appendChild(T3.el); T3.start(); }
    else { const f=document.createElement('div'); f.className='t3fail'; f.textContent='這個瀏覽器無法顯示 3D 畫面，請換用新版 Chrome、Safari 或 Edge。'; st.appendChild(f); }
  } else st.appendChild(view==='B'?drawB(items):drawH(items));
  $('hint').textContent=HINT[view];
  $('say').textContent='米諾的情報站，歡迎進來坐坐';
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){ view=b.dataset.v; document.querySelectorAll('.tabs button').forEach(function(x){ x.setAttribute('aria-selected', String(x===b)); }); render(); });
});
$('prev').addEventListener('click', function(){ cur=Math.min(MAXBACK,cur+1); render(); });
$('next').addEventListener('click', function(){ cur=Math.max(0,cur-1); render(); });
$('toToday').addEventListener('click', function(){ cur=0; $('q').value=''; render(); });
$('q').addEventListener('input', render);
render();
// 回到小島：同一分頁時淡出再切換
document.getElementById('backIsland').addEventListener('click', function(e){
  const a=e.currentTarget; if(a.target==='_blank') return;
  e.preventDefault(); document.getElementById('fade').classList.add('on'); setTimeout(function(){ location.href=a.href; }, 450);
});
})();

<style>

<button type="button" id="bgmBtn" aria-pressed="false" title="背景音樂：Play With Me – PupClub"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="bgmTxt">音樂 🔇</span></button>
<audio id="bgm" src="bgm.mp3" loop preload="none"></audio>
<script>
(function(){
  var a=document.getElementById('bgm'), btn=document.getElementById('bgmBtn'), txt=document.getElementById('bgmTxt');
  var VOL=.22, fadeT=null;
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function sget(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
  function sset(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
  var wantOn = get('li_music')!=='off';
  function ui(on){ btn.classList.toggle('playing',on); btn.setAttribute('aria-pressed',String(on)); txt.textContent = on ? '音樂 🔊' : '音樂 🔇'; btn.setAttribute('aria-label', on ? '關閉背景音樂' : '開啟背景音樂'); }
  function fadeTo(v, done){ clearInterval(fadeT); fadeT=setInterval(function(){ var d=v-a.volume; if(Math.abs(d)<.02){ a.volume=v; clearInterval(fadeT); if(done) done(); return; } a.volume=Math.max(0,Math.min(1,a.volume+d*.15)); },50); }
  function play(){
    var t=parseFloat(sget('li_music_t')||'0'); if(t && !a.currentTime){ try{ a.currentTime=t; }catch(e){} }
    a.volume=0; var p=a.play(); ui(true);
    if(p && p.then) p.then(function(){ fadeTo(VOL); }, function(){ ui(false); });
    else fadeTo(VOL);
  }
  function stop(){ ui(false); fadeTo(0, function(){ a.pause(); }); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); wantOn = a.paused; set('li_music', wantOn?'on':'off'); if(wantOn) play(); else stop(); });
  // 瀏覽器規定要先互動才能出聲：第一次點畫面時開始
  function first(e){ if(e && e.target===btn) return; window.removeEventListener('pointerdown',first,true); window.removeEventListener('keydown',first,true); if(wantOn && a.paused) play(); }
  window.addEventListener('pointerdown',first,true); window.addEventListener('keydown',first,true);
  // 換頁時記住播到哪裡，下一頁接著播
  window.addEventListener('pagehide', function(){ if(!a.paused) sset('li_music_t', String(a.currentTime)); });
  ui(false);
})();
</script>
