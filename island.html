<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linda&#39;s Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: full-bleed 3D sky scene; small name card top-left, place chips along the bottom, info card slides in on the right (bottom sheet on phones). Single sky look on purpose. */
:root{
  --sky-top:#9fd3ec;
  --sky-bottom:#eef7fa;
  --ink:#22405a;
  --ink-soft:#5b7488;
  --paper:#fffdf8;
  --paper-glass:rgba(255,253,248,.88);
  --accent:#e9785a;
  --line:rgba(34,64,90,.12);
  --round:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:radial-gradient(120% 70% at 84% 6%,rgba(255,231,192,.9) 0%,rgba(255,231,192,0) 46%),linear-gradient(180deg,#80bfe4 0%,#bfe1f0 52%,#f7e9d8 100%);
  color:var(--ink);font-family:var(--round);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#scene{position:fixed;inset:0}
#scene canvas{display:block;touch-action:none}

.brand{
  position:fixed;z-index:3;
  top:calc(env(safe-area-inset-top,0px) + 16px);
  left:max(16px,env(safe-area-inset-left,0px));
  background:var(--paper-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:18px;padding:12px 18px;box-shadow:0 6px 20px rgba(34,64,90,.10);
  max-width:calc(100vw - 32px);box-sizing:border-box;
}
.brand h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:.04em;font-weight:400;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}

#tags{position:fixed;inset:0;pointer-events:none;z-index:2}
.tag{
  position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
  font-family:var(--round);font-size:14px;color:var(--ink);
  background:var(--paper);border:0;border-radius:999px;padding:4px 12px;
  box-shadow:0 4px 12px rgba(34,64,90,.16);white-space:nowrap;
  display:flex;align-items:center;gap:6px;will-change:transform;
}
.tag::after{
  content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;
  background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1;
}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.bubble{position:absolute;left:0;top:0;pointer-events:none;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.45;
  padding:5px 10px;border-radius:12px;box-shadow:0 6px 16px rgba(34,64,90,.16);max-width:170px;width:max-content;text-align:center;
  transition:opacity .25s ease;z-index:1;transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.bubble.fade{opacity:0}
@media (max-width:640px){ .bubble{font-size:12px;max-width:150px} }

.chips{
  position:fixed;z-index:3;
  left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
}
.chip{
  font-family:var(--round);font-size:14px;color:var(--ink);cursor:pointer;
  background:var(--paper-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  display:flex;align-items:center;gap:8px;transition:transform .15s ease,background .15s ease;
}
.chip:hover{transform:translateY(-2px);background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--paper);border-color:var(--ink)}

.card{
  position:fixed;z-index:4;
  right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  width:min(340px,calc(100vw - 32px));box-sizing:border-box;
  background:var(--paper);border-radius:22px;padding:22px 22px 18px;
  box-shadow:0 16px 40px rgba(34,64,90,.18);
  animation:pop .28s ease;
}
@keyframes pop{from{opacity:.4;transform:translateY(calc(-50% + 12px))}to{opacity:1;transform:translateY(-50%)}}
.card .eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);letter-spacing:.08em}
.card h2{margin:4px 0 6px;font-size:24px;font-weight:400;line-height:1.3;text-wrap:balance}
.card p{margin:0 0 10px;color:var(--ink)}
.card ul{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:6px}
.card li{background:#f3f7f9;border-radius:12px;padding:7px 12px;font-size:14px;color:var(--ink)}
.btn{
  width:100%;font-family:var(--round);font-size:15px;border:0;border-radius:14px;padding:11px;
  background:var(--ink);color:var(--paper);opacity:.45;cursor:not-allowed;
}
.btn.go{display:block;box-sizing:border-box;text-align:center;text-decoration:none;background:var(--accent);opacity:1;cursor:pointer;transition:transform .15s ease}
.btn.go:hover{transform:translateY(-2px)}
.contact{display:grid;gap:8px;margin:0 0 12px}
.contact .ct{font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
.contact .nm{font-size:18px}
.crow{display:flex;align-items:center;gap:8px;background:#f3f7f9;border-radius:12px;padding:8px 10px 8px 12px}
.crow .ic{flex:none;width:22px;text-align:center}
.crow a,.crow span.v{flex:1;min-width:0;color:var(--ink);text-decoration:none;word-break:break-all;user-select:all;-webkit-user-select:all}
.crow a:hover{text-decoration:underline}
.crow button{flex:none;font-family:var(--round);font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.resident{background:#f6f1e8;border-radius:14px;padding:10px 12px;margin:0 0 12px}
.resident b{font-size:16px;font-weight:400;margin-left:6px}
.resident p{margin:4px 0 0 !important;font-size:14px;line-height:1.6}
.rtag{display:inline-block;font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink-soft)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .btn{opacity:1;cursor:pointer;background:var(--ink)}
.btnrow .btn:hover{filter:brightness(1.12)}
.note{font-size:12px !important;color:var(--ink-soft) !important;margin:10px 0 0 !important;text-align:center}
.close{
  position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;
  border:0;background:#eef3f6;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;font-family:var(--round);
}
.close:hover{background:#e2eaef}
/* ---- 活動中心：會議報名 ---- */
#mt{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(34,64,90,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.mtp{width:min(720px,100%);height:min(86vh,820px);background:var(--paper);border-radius:22px;box-shadow:0 20px 50px rgba(34,64,90,.25);display:flex;flex-direction:column;overflow:hidden}
.mth{padding:18px 20px 10px;border-bottom:1px solid var(--line);position:relative}
.mth h2{margin:0;font-size:22px;font-weight:400}
.mth p{margin:2px 0 10px;font-size:13px;color:var(--ink-soft)}
.mth .close{top:14px;right:14px}
.mkt{display:flex;gap:6px;flex-wrap:wrap}
.mkt button{font-family:var(--round);font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.mkt button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mtl{flex:1;overflow-y:auto;padding:12px 20px;display:grid;gap:10px;align-content:start;min-height:0}
.mtc{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.mtc:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px rgba(233,120,90,.18)}
.mtc input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.mtc .row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-soft)}
.mtag{color:#fff;border-radius:6px;padding:0 7px;font-size:12px;line-height:20px}
.fmt{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;line-height:18px}
.mtc h3{margin:4px 0 2px;font-size:17px;font-weight:400;line-height:1.4;text-wrap:balance}
.mtc .spk{font-size:13px;color:var(--ink-soft);margin:0}
.mtc details{margin-top:4px;font-size:13px}
.mtc summary{cursor:pointer;color:var(--ink-soft)}
.mtc .agenda{white-space:pre-line;margin:4px 0 0;line-height:1.7}
.mtempty{text-align:center;color:var(--ink-soft);padding:40px 10px}
.mtf{border-top:1px solid var(--line);padding:12px 20px 14px;background:#fbf8f2;display:grid;gap:8px}
.mtf .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtf label{display:grid;gap:2px;font-size:12px;color:var(--ink-soft)}
.mtf .fields .full{grid-column:1/-1}
.mtf input[type=text],.mtf input[type=email]{font-family:var(--round);font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);min-width:0}
.mtf .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.mtf .opt label{display:flex;align-items:center;gap:5px;font-size:12px}
.mtf .opt button{font-family:var(--round);font-size:12px;border:0;background:none;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:0}
.mtgo{font-family:var(--round);font-size:16px;border:0;border-radius:14px;padding:11px;background:var(--accent);color:#fff;cursor:pointer}
.mtgo:disabled{opacity:.45;cursor:not-allowed}
.mtmsg{font-size:13px;margin:0;min-height:1.2em}
.mtmsg.err{color:#c2412e}
.mtnote{font-size:11.5px;color:var(--ink-soft);margin:0}
.mtdone{padding:30px 24px;text-align:center;display:grid;gap:10px;align-content:center;flex:1}
.mtdone b{font-size:22px;font-weight:400}
.mtdone ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;text-align:left}
.mtdone li{background:#f3f7f9;border-radius:12px;padding:8px 12px;font-size:14px}
.btn.act{display:block;box-sizing:border-box;text-align:center;background:var(--accent);opacity:1;cursor:pointer}
@media (max-width:640px){.mtp{height:100%;border-radius:18px}.mtf .fields{grid-template-columns:1fr}.mth h2{font-size:19px}}
#fade{position:fixed;inset:0;background:#2a1a10;z-index:50;pointer-events:none;opacity:0;transition:opacity .5s ease}
#fade.on{opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;color:var(--ink-soft);font-size:15px;pointer-events:none}
#nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink)}

@media (max-width:640px){
  .brand h1{font-size:22px}
  .card{
    top:auto;transform:none;left:max(16px,env(safe-area-inset-left,0px));
    width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
    animation:popUp .28s ease;
  }
  @keyframes popUp{from{opacity:.4;transform:translateY(16px)}to{opacity:1;transform:none}}
  body.card-open .chips{display:none}
  .tag{font-size:13px;padding:3px 10px}
}
@media (prefers-reduced-motion:reduce){
  .card,.chip{animation:none;transition:none}
}

/* 夜晚模式 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.4s ease;
  background:radial-gradient(60% 45% at 22% 10%,rgba(170,190,255,.22) 0%,rgba(170,190,255,0) 60%),linear-gradient(180deg,#0b1634 0%,#1b2d5c 55%,#3d4576 100%)}
body.night::before{opacity:1}
@media (prefers-reduced-motion:reduce){body::before{transition:none}}
#dnBtn{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(max(14px,env(safe-area-inset-right,0px)) + 112px);
  font-family:"Huninn","Noto Sans TC",sans-serif;font-size:14px;color:#22405a;
  background:rgba(255,253,246,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(34,64,90,.12);
  border-radius:999px;padding:7px 13px;cursor:pointer;box-shadow:0 4px 12px rgba(34,64,90,.15)}
#dnBtn:hover{background:#fffdf8}
</style>

<div id="scene" aria-label="Linda 小島 3D 場景"></div>
<div id="tags"></div>
<a id="homeBtn" href="index.html">← 回到首頁</a>
<style>#homeBtn{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));font-size:14px;color:var(--ink);text-decoration:none;background:var(--paper-glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:8px 14px;box-shadow:0 4px 12px rgba(34,64,90,.12)}#homeBtn:hover{background:#fffdf8}</style>
<div id="loading">小島正在浮上來…</div>


<nav class="chips" id="chips" aria-label="島上地點"></nav>

<aside class="card" id="card" hidden aria-live="polite">
  <button class="close" id="cardClose" type="button" aria-label="關閉，回到整座島">×</button>
  <span class="eyebrow"><span class="dot" id="cardDot"></span><span id="cardTag"></span></span>
  <h2 id="cardTitle"></h2>
  <p id="cardText"></p>
  <div class="resident" id="cardRes"><span class="rtag" id="resRole"></span><b id="resName"></b><p id="resBio"></p></div>
  <ul id="cardList"></ul>
  <div class="contact" id="cardContact" hidden></div>
  <button class="btn" id="cardBtn" type="button" disabled>即將開放</button>
  <a class="btn go" id="cardLink" href="#" hidden></a>
  <button class="btn act" id="cardAct" type="button" hidden></button>
  <div class="btnrow" id="cardBtns" hidden></div>
  <p class="note" id="cardNote" hidden></p>
</aside>

<div id="mt" hidden role="dialog" aria-modal="true" aria-labelledby="mtTitle">
  <div class="mtp">
    <div class="mth">
      <button class="close" id="mtClose" type="button" aria-label="關閉報名視窗">×</button>
      <h2 id="mtTitle">活動中心・會議報名</h2>
      <p id="mtSub">勾選想參加的會議，填好公司、姓名和 Email 就完成了</p>
      <div class="mkt" id="mtMkt"></div>
    </div>
    <div class="mtl" id="mtList"><div class="mtempty">正在載入會議…</div></div>
    <form class="mtf" id="mtForm" novalidate>
      <div class="fields">
        <label for="mtCompany">公司名稱<input type="text" id="mtCompany" maxlength="80" autocomplete="organization" placeholder="例如：○○投信"></label>
        <label for="mtName">姓名<input type="text" id="mtName" maxlength="50" autocomplete="name" placeholder="你的名字"></label>
        <label for="mtEmail" class="full">Email<input type="email" id="mtEmail" maxlength="120" autocomplete="email" inputmode="email" placeholder="會議通知會寄到這裡"></label>
      </div>
      <div class="opt"><label for="mtRemember"><input type="checkbox" id="mtRemember" checked> 記住我的資料（只存在這台裝置）</label><button type="button" id="mtForget">不是你嗎？清除資料</button></div>
      <p class="mtmsg" id="mtMsg" aria-live="polite"></p>
      <button class="mtgo" id="mtGo" type="submit" disabled>請先勾選會議</button>
      <p class="mtnote">填寫的公司名稱、姓名與 Email，僅用於本次會議報名與會議通知。</p>
    </form>
    <div class="mtdone" id="mtDone" hidden></div>
  </div>
</div>

<div id="fade"></div>
<div id="nogl" hidden><p>這個瀏覽器無法顯示 3D 畫面，請換用新版 Chrome、Safari 或 Edge。</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';

const PLACES = [
  { key:'home',  name:'島主的家', tag:'關於我',   color:'#e9785a',
    text:'認識 Linda，以及這座小島的由來。', items:[], plain:true,
    contact:{name:'Linda Chou', email:'Linda.chou@sinopac.com', phone:'02-2382-3840'} },
  { key:'work',  name:'資訊情報站', tag:'報告摘要', color:'#4f6d8f',
    text:'海內外研究報告的重點摘要都整理在這裡。', items:[],
    link:'info.html', linkText:'進入小屋' },
  { key:'event', name:'活動中心',   tag:'活動報名', color:'#d9744a',
    text:'近期海內外活動都整理在這裡，填好公司名稱和姓名就可以報名。', items:[],
    action:'meetings', linkText:'查看會議・我要報名' },
  { key:'game',  name:'娛樂廣場',   tag:'小遊戲',   color:'#e0a32e',
    text:'《幫島主照顧小孩》在這裡開玩，是島主親自設計的喔！', items:[],
    link:'game/', linkText:'開始遊戲' }
];
const RESIDENTS = {
  home:  {name:'Linda', role:'島主', bio:'小島的主人，目前休假中，但還是每天抽空巡島、很努力維護小島喔！島上的一草一木、大小活動，都是島主一手打造的。'},
  work:  {name:'米諾', role:'情報員', bio:'聰明、可靠又負責的米諾，背包裡永遠裝滿來自日本、韓國、美國、台灣的情報，讓島民第一時間收到最新消息。'},
  event: {name:'珮珮', role:'活動長', bio:'島上最有熱情、最熱心的人！活動中心的大管家，負責籌辦各種活動，也會陪島民一步步完成報名。'},
  game:  {name:'皮皮', role:'遊戲隊長', bio:'島上的開心果，哪裡有笑聲，哪裡就有皮皮。頭上的竹蜻蜓帽轉得越快，代表他越興奮。最喜歡的事是玩遊戲，第二喜歡的事是……也是玩遊戲！'}
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow = function(){ return window.innerWidth < 640; };
const LOW = narrow();

/* ================= 渲染器與光線 ================= */
let renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); }
catch(e){ document.getElementById('nogl').hidden=false; document.getElementById('loading').hidden=true; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, LOW?1.5:2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('scene').appendChild(renderer.domElement);

const C = function(hex){ return new THREE.Color(hex).convertSRGBToLinear(); };

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C('#e4edf0'), 58, 120);

// 天空環境光：部分裝置不支援，改用半球光
(function(){ return;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16), new THREE.ShaderMaterial({
    side:THREE.BackSide,
    vertexShader:'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'varying vec3 vP;',
      'void main(){',
      '  float h=vP.y;',
      '  vec3 zen=vec3(0.30,0.55,0.85), hor=vec3(0.85,0.92,0.95), gnd=vec3(0.30,0.36,0.22);',
      '  vec3 c = h>0.0 ? mix(hor,zen,pow(h,0.6)) : mix(hor,gnd,pow(-h,0.4));',
      '  gl_FragColor=vec4(c*1.1,1.0);',
      '}'].join('\n')
  })));
  pmrem.dispose();
})();

const camera = new THREE.PerspectiveCamera(36, window.innerWidth/window.innerHeight, 0.1, 240);
const DEFAULT_TARGET = new THREE.Vector3(0,-2,0);

/* ================= 小工具 ================= */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rand = rng(1118);
const pick = function(a){ return a[Math.floor(rand()*a.length)]; };
const clamp = function(x,a,b){ return Math.max(a,Math.min(b,x)); };
const ss = function(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const lerp = function(a,b,t){ return a+(b-a)*t; };
function h2(ix,iz,s){ const n=Math.sin(ix*127.1+iz*311.7+s*74.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,z,s){
  s = s||0;
  const ix=Math.floor(x), iz=Math.floor(z), fx=x-ix, fz=z-iz;
  const u=fx*fx*(3-2*fx), v=fz*fz*(3-2*fz);
  const a=h2(ix,iz,s), b=h2(ix+1,iz,s), c=h2(ix,iz+1,s), d=h2(ix+1,iz+1,s);
  return lerp(lerp(a,b,u), lerp(c,d,u), v)*2-1;
}
function fbm(x,z,oct,s){ let sum=0, amp=.5, f=1; for(let i=0;i<(oct||4);i++){ sum+=amp*vnoise(x*f,z*f,(s||0)+i*13); amp*=.5; f*=2.03; } return sum; }
function distSeg(px,pz,a,b){
  const vx=b.x-a.x, vz=b.z-a.z, l2=vx*vx+vz*vz;
  let t = l2?((px-a.x)*vx+(pz-a.z)*vz)/l2:0; t=clamp(t,0,1);
  return Math.hypot(px-(a.x+vx*t), pz-(a.z+vz*t));
}
const V = function(x,z){ return new THREE.Vector3(x,0,z); };
const dist2 = function(p,x,z){ return Math.hypot(p.x-x, p.z-z); };

const matCache = {};
function mat(hex, extra){
  const k = hex + (extra?JSON.stringify(extra):'');
  if(!matCache[k]){
    const o = Object.assign({color:C(hex), roughness:.85, metalness:0}, extra||{});
    if(o.emissive) o.emissive = C(o.emissive);
    matCache[k] = new THREE.MeshStandardMaterial(o);
  }
  return matCache[k];
}
function mesh(geo, m, opts){
  const x = new THREE.Mesh(geo, typeof m==='string'?mat(m):m);
  opts = opts||{};
  x.castShadow = opts.cast!==false; x.receiveShadow = opts.receive!==false;
  return x;
}
function addAt(p, o, x, y, z){ o.position.set(x,y,z); p.add(o); return o; }
const dummy = new THREE.Object3D();
function instanced(geo, list, m, opts){
  opts = opts||{};
  const im = new THREE.InstancedMesh(geo, m, list.length);
  list.forEach(function(it,i){
    dummy.position.set(it.x,it.y,it.z);
    dummy.rotation.set(it.rx||0, it.ry||0, it.rz||0);
    if(Array.isArray(it.s)) dummy.scale.set(it.s[0],it.s[1],it.s[2]); else dummy.scale.setScalar(it.s||1);
    dummy.updateMatrix();
    im.setMatrixAt(i, dummy.matrix);
    im.setColorAt(i, it.c.isColor ? it.c : C(it.c));
  });
  im.instanceMatrix.needsUpdate = true;
  if(im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = opts.cast!==false; im.receiveShadow = opts.receive!==false;
  return im;
}
function vary(hex, dl, ds){ const c=new THREE.Color(hex); c.offsetHSL((rand()-.5)*.02, (rand()-.5)*(ds||.06), (rand()-.5)*(dl||.08)); return c.convertSRGBToLinear(); }

/* 程式畫的材質貼圖 */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(size, draw){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'), size);
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=maxAniso;
  return t;
}
const shade = function(hex, l){ const c=new THREE.Color(hex); c.offsetHSL(0,0,l); return c.getStyle(); };
function shingleTex(base){
  return canvasTex(256, function(g,S){
    g.fillStyle=shade(base,-.12); g.fillRect(0,0,S,S);
    const rows=8, cols=8, rh=S/rows, cw=S/cols;
    for(let r=0;r<rows;r++){
      const off = (r%2)*cw/2;
      for(let c=-1;c<=cols;c++){
        const x=c*cw+off, y=r*rh;
        g.fillStyle=shade(base,(Math.random()-.5)*.08);
        g.beginPath();
        g.moveTo(x+1,y); g.lineTo(x+cw-1,y); g.lineTo(x+cw-1,y+rh*.62);
        g.quadraticCurveTo(x+cw/2,y+rh+2,x+1,y+rh*.62); g.closePath(); g.fill();
        g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(x,y+rh-3,cw,3);
      }
    }
  });
}
function plankTex(base){
  return canvasTex(256, function(g,S){
    const n=8, bh=S/n;
    for(let i=0;i<n;i++){
      g.fillStyle=shade(base,(Math.random()-.5)*.05); g.fillRect(0,i*bh,S,bh);
      g.fillStyle='rgba(80,55,30,.22)'; g.fillRect(0,i*bh+bh-2,S,2);
      g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(0,i*bh,S,1);
      const sx = Math.random()*S; g.fillStyle='rgba(80,55,30,.18)'; g.fillRect(sx,i*bh,2,bh);
    }
  });
}
function stoneTex(base){
  return canvasTex(256, function(g,S){
    g.fillStyle='#9a9285'; g.fillRect(0,0,S,S);
    const rows=6, rh=S/rows;
    for(let r=0;r<rows;r++){
      let x = -(Math.random()*30);
      while(x<S){
        const w = 30+Math.random()*34;
        g.fillStyle=shade(base,(Math.random()-.5)*.14);
        const rx=x+3, ry=r*rh+3, rw=w-6, rhh=rh-6, rad=7;
        g.beginPath(); g.moveTo(rx+rad,ry); g.arcTo(rx+rw,ry,rx+rw,ry+rhh,rad); g.arcTo(rx+rw,ry+rhh,rx,ry+rhh,rad);
        g.arcTo(rx,ry+rhh,rx,ry,rad); g.arcTo(rx,ry,rx+rw,ry,rad); g.fill();
        x += w;
      }
    }
  });
}

/* ================= 小島配置 ================= */
const R = 10.5;
const PLAZA = V(0.6,0.6);
const HILL = V(-4.3,-4.4);
const POND = V(-0.9,5.4);
const SPRING = V(-7.0,-2.2);
const POS = { work:V(-6.0,2.7), event:V(5.2,3.0), game:V(4.0,-4.9) };
const rimR = function(th){ return R*(1 + .045*vnoise(Math.cos(th)*1.6+11, Math.sin(th)*1.6+7) + .025*vnoise(Math.cos(th)*4+3, Math.sin(th)*4-5)); };
function edgeAt(dx,dz,inset){ const th=Math.atan2(dz,dx); const r=rimR(th)-(inset||0); return V(Math.cos(th)*r, Math.sin(th)*r); }

const toHill = V(PLAZA.x-HILL.x, PLAZA.z-HILL.z).normalize();
const hillBase = V(HILL.x+toHill.x*4.0, HILL.z+toHill.z*4.0);
const hillTop  = V(HILL.x+toHill.x*1.25, HILL.z+toHill.z*1.25);
function frontOf(p, d){ const dir=V(PLAZA.x-p.x, PLAZA.z-p.z).normalize(); return V(p.x+dir.x*d, p.z+dir.z*d); }
const pathSegs = [
  [PLAZA, frontOf(POS.work,1.6)], [PLAZA, frontOf(POS.event,1.9)], [PLAZA, frontOf(POS.game,1.6)],
  [PLAZA, hillBase], [hillBase, hillTop]
];
const EDGE1 = edgeAt(-0.16,1,-.2), EDGE2 = edgeAt(-1,0.2,-.2);
const riverSegs = [[POND, EDGE1],[SPRING, EDGE2]];

function riverW(x,z){ let w=0; riverSegs.forEach(function(s){ w=Math.max(w, ss(.8,.38,distSeg(x,z,s[0],s[1]))); }); return w; }
function pathW(x,z){
  let w=0; const n=.09*vnoise(x*4,z*4,5);
  pathSegs.forEach(function(s){ w=Math.max(w, ss(.46,.28,distSeg(x,z,s[0],s[1])+n)); });
  return w;
}
function heightAt(x,z){
  let y = .2*fbm(x*.32+3, z*.32-2, 3, 1) + .06*fbm(x*1.3, z*1.3, 2, 9);
  [PLAZA, POS.work, POS.event, POS.game].forEach(function(p){ y = lerp(y, 0, ss(2.7,1.7,dist2(p,x,z))); });
  const dh = dist2(HILL,x,z);
  y = lerp(y, 0, ss(2.0,1.2,dh)) + 2.2*ss(4.1,1.35,dh);
  y -= .45*ss(2.1,1.25,dist2(POND,x,z));
  y -= .32*ss(1.05,.55,dist2(SPRING,x,z));
  y -= .34*riverW(x,z);
  return y;
}
const G1='#457f2a', G2='#82b544', DIRT='#c2a374', STONE='#d4c8b0', SAND='#cdbd8c';
const tmpA=new THREE.Color(), tmpB=new THREE.Color();
function surface(x,z){
  const pw=pathW(x,z), pp=ss(1.8,1.55,dist2(PLAZA,x,z)+.06*vnoise(x*5,z*5,3));
  const wb=Math.max(ss(2.3,1.7,dist2(POND,x,z)), ss(1.3,.9,dist2(SPRING,x,z)), ss(.95,.62,riverSegs.reduce(function(m,s){ return Math.min(m,distSeg(x,z,s[0],s[1])); },99)));
  return {pw:pw, pp:pp, wb:wb};
}
function groundColor(x,z,t){
  const n = fbm(x*.45,z*.45,3,21)*.5+.5, sp = vnoise(x*3.1,z*3.1,4);
  tmpA.set(G1).lerp(tmpB.set(G2), clamp(n*1.1,0,1));
  tmpA.offsetHSL(0,0,sp*.03);
  const mw = ss(.52,.78, fbm(x*.22+40,z*.22-13,2,33)*.5+.5);
  tmpA.lerp(tmpB.set('#b3c957'), mw*.34);
  const cl = ss(.6,.85, fbm(x*.5-20,z*.5+9,2,44)*.5+.5);
  tmpA.lerp(tmpB.set('#3f7a2a'), cl*.35);
  const s = surface(x,z);
  if(s.wb>0) tmpA.lerp(tmpB.set(SAND), s.wb);
  if(s.pw>0) tmpA.lerp(tmpB.set(DIRT).offsetHSL(0,0,vnoise(x*6,z*6,8)*.04), s.pw);
  if(s.pp>0){ const tile = (Math.sin(x*6)*Math.sin(z*6) > 0) ? .02 : -.02; tmpA.lerp(tmpB.set(STONE).offsetHSL(0,0,tile), s.pp); }
  if(t>.95) tmpA.offsetHSL(0,0,-.05*ss(.95,1,t));
  return tmpA.clone().convertSRGBToLinear();
}
function grassOK(x,z){ const s=surface(x,z); return Math.max(s.pw,s.pp,s.wb) < .15; }

/* ================= 生成浮島（地面＋岩壁） ================= */
function fixWinding(geo, expect){
  const p=geo.attributes.position, idx=geo.index.array;
  const a=new THREE.Vector3(), b=new THREE.Vector3(), c=new THREE.Vector3();
  for(let i=0;i<idx.length;i+=3){
    a.fromBufferAttribute(p,idx[i]); b.fromBufferAttribute(p,idx[i+1]); c.fromBufferAttribute(p,idx[i+2]);
    const n = new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(c,a));
    if(n.lengthSq() < 1e-8) continue;
    const ctr = a.clone().add(b).add(c).divideScalar(3);
    if(n.dot(expect(ctr)) < 0){ for(let j=0;j<idx.length;j+=3){ const t=idx[j+1]; idx[j+1]=idx[j+2]; idx[j+2]=t; } }
    break;
  }
}
const STRATA=['#a98b6d','#927c67','#bba283','#86766a'].map(function(h){ return new THREE.Color(h); }), STRATA_DEEP=new THREE.Color('#6b6a7a');
function buildIsland(o){
  const g = new THREE.Group();
  const NR=o.NR, NS=o.NS;
  // 上方地面
  const pos=[], col=[], idx=[], rimY=[];
  for(let i=0;i<=NR;i++){
    const t=i/NR;
    for(let j=0;j<NS;j++){
      const th=j/NS*Math.PI*2, r=o.rim(th)*t, x=Math.cos(th)*r, z=Math.sin(th)*r;
      const fall = o.edgeDrop*ss(.86,1,t)*(1-.85*(o.riverW?o.riverW(x,z):0));
      const y = o.height(x,z) - fall;
      pos.push(x,y,z);
      const c = o.color(x,z,t); col.push(c.r,c.g,c.b);
      if(i===NR) rimY.push(y);
    }
  }
  for(let i=0;i<NR;i++) for(let j=0;j<NS;j++){
    const a=i*NS+j, b=i*NS+(j+1)%NS, c=(i+1)*NS+j, d=(i+1)*NS+(j+1)%NS;
    idx.push(a,c,b, b,c,d);
  }
  const top = new THREE.BufferGeometry();
  top.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  top.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  top.setIndex(idx);
  fixWinding(top, function(){ return new THREE.Vector3(0,1,0); });
  top.computeVertexNormals();
  g.add(mesh(top, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1, metalness:0})));

  // 下方岩壁
  const NY=o.NY, D=o.depth, cp=[], cc=[], ci=[];
  const lip=C(o.lipColor||'#5a9431'), dirt=C('#7a5a3a'), rA=new THREE.Color('#857b6e'), rB=new THREE.Color('#b3a794');
  for(let k=0;k<=NY;k++){
    for(let j=0;j<NS;j++){
      const th=j/NS*Math.PI*2, ct=Math.cos(th), st=Math.sin(th), R0=o.rim(th), y0=rimY[j];
      let r, y, c;
      if(k===0){ r=R0; y=y0; c=lip; }
      else if(k===1){ r=R0*1.012; y=y0-.22; c=lip; }
      else if(k===2){ r=R0*.99; y=y0-.5; c=dirt; }
      else {
        const s=(k-2)/(NY-2);
        y = y0-.5-D*Math.pow(s,1.12);
        const crag = (.55*vnoise(ct*3+y*.22, st*3-y*.22, o.seed) + .28*vnoise(ct*9+y*.6, st*9, o.seed+3))*(1-s);
        const ridge = .22*Math.abs(Math.sin(th*o.ridges + 2.5*vnoise(ct*2,st*2,o.seed+7) + y*.15))*(1-s);
        r = Math.max(0, R0*.97*Math.pow(1-s,.72) + R0*.075*crag + ridge);
        const lv = y*1.05 + 1.3*vnoise(ct*2+y*.1, st*2, o.seed+5);
        const layer = ((Math.floor(lv)%4)+4)%4, lf = lv-Math.floor(lv);
        const base = STRATA[layer].clone().lerp(STRATA[(layer+1)%4], ss(.82,1,lf)*.5);
        base.offsetHSL(0,0,vnoise(ct*14+y,st*14-y,o.seed+11)*.04 - .05*ss(.8,1,lf));
        if(s<.08) base.lerp(new THREE.Color('#6a4a30'), 1-s/.08);
        base.lerp(STRATA_DEEP, ss(.3,1,s)*.62);
        base.multiplyScalar(1-.3*s);
        c = base.convertSRGBToLinear();
      }
      cp.push(ct*r, y, st*r); cc.push(c.r,c.g,c.b);
    }
  }
  for(let k=0;k<NY;k++) for(let j=0;j<NS;j++){
    const a=k*NS+j, b=k*NS+(j+1)%NS, c=(k+1)*NS+j, d=(k+1)*NS+(j+1)%NS;
    ci.push(a,b,c, b,d,c);
  }
  const cliff = new THREE.BufferGeometry();
  cliff.setAttribute('position', new THREE.Float32BufferAttribute(cp,3));
  cliff.setAttribute('color', new THREE.Float32BufferAttribute(cc,3));
  cliff.setIndex(ci);
  fixWinding(cliff, function(p){ return new THREE.Vector3(p.x,0,p.z); });
  cliff.computeVertexNormals();
  g.add(mesh(cliff, new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:.95, metalness:0})));
  return g;
}

function waterRibbon(a,b,w){
  const dx=b.x-a.x, dz=b.z-a.z, len=Math.hypot(dx,dz);
  const m=mesh(new THREE.PlaneGeometry(w,len), waterMat, {cast:false});
  m.rotation.order='YXZ'; m.rotation.set(-Math.PI/2, Math.atan2(dx,dz), 0);
  addAt(island,m,(a.x+b.x)/2,WY,(a.z+b.z)/2);

const fallUniforms=[], mist=[];
function waterfall(edge, len){
  const dir = V(edge.x,edge.z).normalize();
  const u = {uTime:{value:0}, uSeed:{value:rand()*10}, uDim:{value:1}};
  fallUniforms.push(u);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.0,len,1,1), new THREE.ShaderMaterial({
    uniforms:u, transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:[
      'uniform float uTime; uniform float uSeed; uniform float uDim; varying vec2 vUv;',
      'void main(){',
      '  float s = fract(vUv.y*7.0 + uTime*1.1 + sin(vUv.x*21.0+uSeed)*0.15);',
      '  float s2 = fract(vUv.y*13.0 + uTime*1.6 + sin(vUv.x*9.0+uSeed*2.0)*0.2);',
      '  float streak = smoothstep(0.7,1.0,s)*0.5 + smoothstep(0.8,1.0,s2)*0.35;',
      '  float edge = smoothstep(0.0,0.22,vUv.x)*smoothstep(1.0,0.78,vUv.x);',
      '  vec3 col = mix(vec3(0.55,0.80,0.90), vec3(1.0), streak + 0.15);',
      '  float a = edge * smoothstep(0.0,0.6,vUv.y) * 0.92;',
      '  gl_FragColor = vec4(col*uDim, a);',
      '}'].join('\n')
  }));
  const r = edge.length()+.18;
  m.position.set(dir.x*r, WY-len/2, dir.z*r);
  m.rotation.y = Math.atan2(dir.x, dir.z);
  island.add(m);
  const foamM = mat('#ffffff',{roughness:1});
  for(let i=0;i<6;i++) addAt(island, mesh(new THREE.IcosahedronGeometry(.1+rand()*.09,1), foamM, {cast:false}), dir.x*(r-.05)+(rand()-.5)*.7, WY+.03+rand()*.06, dir.z*(r-.05)+(rand()-.5)*.7);
  for(let i=0;i<6;i++){
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(.55,2), new THREE.MeshStandardMaterial({color:C('#ffffff'), roughness:1, transparent:true, opacity:.45, depthWrite:false}));
    s.position.set(dir.x*(r+.35)+(rand()-.5)*.9, -len*.55+(rand()-.5)*.9, dir.z*(r+.35)+(rand()-.5)*.9);
    island.add(s); mist.push({m:s, ph:rand()*6.28, base:s.position.y});
  }
}

function makeHouse(o){
  const g = new THREE.Group();
  const w=o.w||2.1, d=o.d||1.9, h=o.h||1.35, rh=o.roofH||1.0, F=.3;
  const wallT = plankTex(o.wall||'#f1e3c8'); wallT.repeat.set(w/1.6, h/1.1);
  const wallM = new THREE.MeshStandardMaterial({map:wallT, roughness:.85});
  const stT = stoneTex('#b9b0a0'); stT.repeat.set(w/1.2,.5);
  addAt(g, mesh(new THREE.BoxGeometry(w+.3,F,d+.3), new THREE.MeshStandardMaterial({map:stT, roughness:.95})), 0,F/2,0);
  addAt(g, mesh(new THREE.BoxGeometry(w,h,d), wallM), 0,F+h/2,0);
  // 山牆三角形
  const tri = new THREE.Shape(); tri.moveTo(-w/2,0); tri.lineTo(w/2,0); tri.lineTo(0,rh); tri.closePath();
  const gT = plankTex(o.wall||'#f1e3c8'); gT.repeat.set(.62,.9);
  const gable = new THREE.ExtrudeGeometry(tri,{depth:d,bevelEnabled:false}); gable.translate(0,0,-d/2);
  addAt(g, mesh(gable, new THREE.MeshStandardMaterial({map:gT, roughness:.85})), 0,F+h,0);
  // 斜屋頂（兩片）
  const a = Math.atan2(rh, w/2), over=.32, run=w/2+over, L=run/Math.cos(a)+.06;
  const roofT = shingleTex(o.roof); roofT.center.set(.5,.5); roofT.rotation=Math.PI/2; roofT.repeat.set((d+.5)/1.1, L/1.0);
  const roofM = new THREE.MeshStandardMaterial({map:roofT, roughness:.75});
  const ridgeY = F+h+rh+.07;
  [-1,1].forEach(function(sd){
    const s = mesh(new THREE.BoxGeometry(L,.12,d+.5), roofM);
    s.rotation.z = -sd*a;
    s.position.set(sd*run/2, ridgeY - (run/2)*Math.tan(a), 0);
    g.add(s);
  });
  addAt(g, mesh(new THREE.BoxGeometry(.2,.14,d+.55), mat('#'+new THREE.Color(o.roof).offsetHSL(0,0,-.18).getHexString())), 0,ridgeY+.02,0);
  // 角柱
  const trim = o.trim||'#8c6440';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){ addAt(g, mesh(new THREE.BoxGeometry(.12,h,.12), trim), c[0]*(w/2-.01), F+h/2, c[1]*(d/2-.01)); });
  addAt(g, mesh(new THREE.BoxGeometry(w+.04,.08,d+.04), trim), 0,F+h,0);
  // 門
  const fz = d/2;
  addAt(g, mesh(new THREE.BoxGeometry(.56,.86,.05), '#f4ede0'), 0,F+.43,fz+.01);
  const dT = plankTex(o.door||'#7a4f33'); dT.rotation=Math.PI/2; dT.center.set(.5,.5); dT.repeat.set(.5,.5);
  addAt(g, mesh(new THREE.BoxGeometry(.44,.76,.06), new THREE.MeshStandardMaterial({map:dT, roughness:.8})), 0,F+.38,fz+.025);
  addAt(g, mesh(new THREE.SphereGeometry(.035,10,8), mat('#e2b84a',{metalness:.7,roughness:.3})), .14,F+.38,fz+.07);
  addAt(g, mesh(new THREE.BoxGeometry(.8,.12,.4), '#cfc6b6'), 0,.06,fz+.35);
  addAt(g, mesh(new THREE.BoxGeometry(.8,.1,.12), '#a69c8a'), 0,F+.82,fz+.06);
  // 窗戶
  const glass = mat('#9cc6d8',{roughness:.08, metalness:.25, emissive:'#ffcf80', emissiveIntensity:.18});
  const shutterC = o.shutter||'#5d7f9e';
  function windowAt(x,y,z,ry,withBox){
    const W = new THREE.Group();
    addAt(W, mesh(new THREE.BoxGeometry(.5,.5,.05), '#fbf7ef'), 0,0,0);
    addAt(W, mesh(new THREE.BoxGeometry(.38,.38,.06), glass), 0,0,.01);
    addAt(W, mesh(new THREE.BoxGeometry(.04,.38,.07), '#fbf7ef'), 0,0,.015);
    addAt(W, mesh(new THREE.BoxGeometry(.38,.04,.07), '#fbf7ef'), 0,0,.015);
    [-1,1].forEach(function(s){ addAt(W, mesh(new THREE.BoxGeometry(.16,.5,.04), shutterC), s*.35,0,0); });
    if(withBox){
      addAt(W, mesh(new THREE.BoxGeometry(.52,.1,.16), '#8a5a35'), 0,-.31,.07);
      for(let k=0;k<5;k++) addAt(W, mesh(new THREE.IcosahedronGeometry(.05,1), k%2? (o.flower||'#f08aa5') : '#5e9a3b', {cast:false}), -.2+k*.1, -.24, .09);
    }
    W.position.set(x,y,z); W.rotation.y=ry; g.add(W);
  }
  windowAt(-w*.3, F+h*.58, fz+.03, 0, true);
  windowAt( w*.3, F+h*.58, fz+.03, 0, true);
  windowAt(w/2+.03, F+h*.58, 0, Math.PI/2, false);
  windowAt(-w/2-.03, F+h*.58, 0, -Math.PI/2, false);
  // 山牆圓窗
  const rw = mesh(new THREE.CylinderGeometry(.17,.17,.06,20), '#fbf7ef'); rw.rotation.x=Math.PI/2; addAt(g, rw, 0,F+h+rh*.38,fz+.02);
  const rg = mesh(new THREE.CylinderGeometry(.12,.12,.07,20), glass); rg.rotation.x=Math.PI/2; addAt(g, rg, 0,F+h+rh*.38,fz+.03);
  // 煙囪
  if(o.chimney!==false){
    const cT = stoneTex('#b0a08c'); cT.repeat.set(.4,.7);
    addAt(g, mesh(new THREE.BoxGeometry(.3,1.1,.3), new THREE.MeshStandardMaterial({map:cT, roughness:.95})), w*.24, F+h+rh*.62, -d*.18);
    addAt(g, mesh(new THREE.BoxGeometry(.36,.08,.36), '#8f8170'), w*.24, F+h+rh*.62+.58, -d*.18);
  }
  // 灌木
  const bushM = new THREE.MeshStandardMaterial({color:'#ffffff', roughness:.9});
  const bl=[];
  [-1,1].forEach(function(s){
    bl.push({x:s*(w/2+.18),y:.3,z:fz+.15,s:.3,c:vary('#4f8f2e')});
    bl.push({x:s*(w/2+.45),y:.22,z:fz+.32,s:.22,c:vary('#6aa83a')});
    bl.push({x:s*(w/2+.2),y:.25,z:-fz+.2,s:.26,c:vary('#4f8f2e')});
  });
  g.add(instanced(new THREE.IcosahedronGeometry(1,2), bl, bushM));
  g.userData.top = F+h+rh;
  g.userData.chimney = new THREE.Vector3(w*.24, F+h+rh*.62+.65, -d*.18);
  return g;
}

const placeGroups = {};
function placeHouse(key, house, p, y){

  house.traverse(function(o){ if(o.isMesh) o.userData.key = key; });
  island.add(house); placeGroups[key] = house;
}

const UP = new THREE.Vector3(0,1,0), O3 = function(x,y,z){ return new THREE.Vector3(x||0,y||0,z||0); };
const fs = function(hex){ return mat(hex,{flatShading:true, roughness:.88}); };
const lighten = function(hex,l){ return '#'+new THREE.Color(hex).offsetHSL(0,0,l).getHexString(); };
function lumpy(geo, amt, seed){
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),z=p.getZ(i), k=1+amt*vnoise(x*2.3+seed*7, z*2.3+y*1.7, seed); p.setXYZ(i,x*k,y*k,z*k); }
  geo.computeVertexNormals(); return geo;
}
const blobGeos=[1,2,3,4,5].map(function(i){ return lumpy(new THREE.IcosahedronGeometry(1,1), .16, i); });
const dropGeos=[9,10,11].map(function(i){
  const g=new THREE.IcosahedronGeometry(1,1), p=g.attributes.position;
  for(let j=0;j<p.count;j++){ let x=p.getX(j),y=p.getY(j),z=p.getZ(j); if(y>0){ const k=1-.55*y; x*=k; z*=k; y*=1.55; } else y*=.9; p.setXYZ(j,x,y,z); }
  return lumpy(g,.1,i);
});
const pineGeos=[0,1].map(function(i){

      const k=Math.round((Math.atan2(p.getZ(j),p.getX(j))+Math.PI)/(Math.PI*2)*10+i);
      if(k%2===1) p.setY(j,-.5-.2);

});

function limb(parent, base, dir, len, r0, r1, m){
  const g=new THREE.CylinderGeometry(r1,r0,len,6,1); g.translate(0,len/2,0);
  const x=mesh(g,m); x.position.copy(base); x.quaternion.setFromUnitVectors(UP, dir.clone().normalize()); parent.add(x);
  return base.clone().add(dir.clone().normalize().multiplyScalar(len));
}
function canopy(parent, geo, pos, sc, hex){
  const m=mesh(geo, fs(hex)); m.position.copy(pos);
  if(Array.isArray(sc)) m.scale.set(sc[0],sc[1],sc[2]); else m.scale.setScalar(sc);
  m.rotation.y=rand()*6.28; parent.add(m); return m;
}
function birch(cols){
  const g=new THREE.Group();
  const top=limb(g,O3(),O3((rand()-.5)*.12,1,(rand()-.5)*.12),1.75,.1,.065,birchMat);
  const b1=limb(g,O3(0,.8,0),O3(.6,1,.15),.85,.06,.035,birchMat);
  const b2=limb(g,O3(0,1.05,0),O3(-.55,1,-.25),.75,.055,.03,birchMat);
  const b3=limb(g,O3(0,1.3,0),O3(.1,1,-.6),.55,.045,.025,birchMat);
  canopy(g,pick(dropGeos),top.add(O3(0,.32,0)),[.42,.55,.42],cols[0]);
  canopy(g,pick(dropGeos),b1.add(O3(0,.28,0)),[.34,.45,.34],cols[1]);
  canopy(g,pick(dropGeos),b2.add(O3(0,.26,0)),[.32,.42,.32],cols[2]);
  canopy(g,pick(dropGeos),b3.add(O3(0,.2,0)),[.25,.33,.25],cols[1]);
  return g;
}
function oak(hex, blossom){
  const g=new THREE.Group();
  const p1=limb(g,O3(),O3(.18,1,0),.75,.17,.12,bark);
  const p2=limb(g,p1,O3(-.22,1,.08),.6,.12,.09,bark);
  const p3=limb(g,p2,O3(.25,1,-.05),.45,.09,.07,bark);
  const t1=limb(g,p1,O3(-.8,1,.3),.6,.07,.04,bark);
  const t2=limb(g,p2,O3(.75,1,-.35),.55,.06,.035,bark);
  const lite=lighten(hex,.05), dark=lighten(hex,-.05);
  const list=[[p3,O3(0,.35,0),.62,hex],[p3,O3(.45,.1,.2),.5,lite],[p3,O3(-.42,.15,-.25),.5,dark],[t1,O3(0,.15,0),.42,lite],[t2,O3(0,.15,0),.42,dark],[p3,O3(.05,.05,.5),.45,hex]];
  list.forEach(function(b){
    const c=b[0].clone().add(b[1]); canopy(g,pick(blobGeos),c,b[2],b[3]);
    if(blossom){ for(let k=0;k<3;k++){ const d=O3(rand()-.5,rand()*.9,rand()-.5).normalize(); addAt(g, mesh(new THREE.OctahedronGeometry(.05,0), fs('#f39ac0'),{cast:false}), c.x+d.x*b[2], c.y+d.y*b[2], c.z+d.z*b[2]); } }
  });
  return g;
}
function fruitTree(fruit){

function rbox(w, h, d, r, taper){
  const g = new THREE.BoxGeometry(w, h, d, 6, 6, 6), p = g.attributes.position, v = new THREE.Vector3(), c = new THREE.Vector3();
  const ix=w/2-r, iy=h/2-r, iz=d/2-r;
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    c.set(Math.max(-ix,Math.min(ix,v.x)), Math.max(-iy,Math.min(iy,v.y)), Math.max(-iz,Math.min(iz,v.z)));
    const n = v.clone().sub(c); if(n.lengthSq()>0) n.normalize().multiplyScalar(r);
    v.copy(c).add(n);
    if(taper){ const t=(v.y+h/2)/h, s=taper[0]+(taper[1]-taper[0])*t; v.x*=s; v.z*=lerp(1, s, .5); }

  g.computeVertexNormals(); return g;
}

    F.holder.getWorldPosition(tmp); tmp.y += (F.c.hY + (F.f.who==='kid'?1.0:.9))*F.c.root.scale.y*FOLK_S;
    const dist = camera.position.distanceTo(tmp);
    const near = dist < (narrow()?34:28) || selected===F.f.house;
    tmp.project(camera);
    if(tmp.z>1 || !near){ F.el.style.visibility='hidden'; return; }
    const sc = Math.max(.72, Math.min(1, 15/dist));
    F.el.style.visibility='visible';
    F.el.style.transform='translate('+((tmp.x+1)/2*W)+'px,'+((1-tmp.y)/2*H-6)+'px) translate(-50%,-100%) scale('+sc.toFixed(3)+')';
  });
  requestAnimationFrame(tick);
}
tick();
})();
</script>

@keyframes eq{0%,100%{height:3px}50%{height:12px}}

</style>
<button type="button" id="bgmBtn" aria-pressed="false" title="背景音樂：Play With Me – PupClub"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="bgmTxt">音樂 🔇</span></button>
<audio id="bgm" src="bgm.mp3" loop preload="none"></audio>
<script>
(function(){
  var a=document.getElementById('bgm'), btn=document.getElementById('bgmBtn'), txt=document.getElementById('bgmTxt');
  var VOL=.22, fadeT=null;
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function sget(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
  function sset(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
  var wantOn = get('li_music')!=='off';
  function ui(on){ btn.classList.toggle('playing',on); btn.setAttribute('aria-pressed',String(on)); txt.textContent = on ? '音樂 🔊' : '音樂 🔇'; btn.setAttribute('aria-label', on ? '關閉背景音樂' : '開啟背景音樂'); }
  function fadeTo(v, done){ clearInterval(fadeT); fadeT=setInterval(function(){ var d=v-a.volume; if(Math.abs(d)<.02){ a.volume=v; clearInterval(fadeT); if(done) done(); return; } a.volume=Math.max(0,Math.min(1,a.volume+d*.15)); },50); }
  function play(){
    var t=parseFloat(sget('li_music_t')||'0'); if(t && !a.currentTime){ try{ a.currentTime=t; }catch(e){} }
    a.volume=0; var p=a.play(); ui(true);
    if(p && p.then) p.then(function(){ fadeTo(VOL); }, function(){ ui(false); });
    else fadeTo(VOL);
  }
  function stop(){ ui(false); fadeTo(0, function(){ a.pause(); }); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); wantOn = a.paused; set('li_music', wantOn?'on':'off'); if(wantOn) play(); else stop(); });
  // 瀏覽器規定要先互動才能出聲：第一次點畫面時開始
  function first(e){ if(e && e.target===btn) return; window.removeEventListener('pointerdown',first,true); window.removeEventListener('keydown',first,true); if(wantOn && a.paused) play(); }
  window.addEventListener('pointerdown',first,true); window.addEventListener('keydown',first,true);
  // 換頁時記住播到哪裡，下一頁接著播
  window.addEventListener('pagehide', function(){ if(!a.paused) sset('li_music_t', String(a.currentTime)); });
  ui(false);
})();
</script>
