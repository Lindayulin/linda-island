<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🍼 幫Linda 照顧小孩DEMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEAE6;--bg2:#D8D5D0;--ink:#4A3F36;--soft:#8A7D70;--chip:#FBF8F3;--accent:#C98A5B;--line:rgba(74,63,54,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background-color:var(--bg);background:radial-gradient(120% 90% at 50% 40%,var(--bg) 0%,var(--bg2) 100%);font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);transition:background .8s}
body.night{--bg:#3B3B4E;--bg2:#1F2030;--ink:#F3ECE2;--soft:#C3B8AC;--chip:#454458;--line:rgba(255,255,255,.14)}
/* 傍晚：淺色的卡片、對話框、按鍵維持深色字 */
body.night :is(.rdy,.endc,.sel,.rc,.evbox,.sheetbox,kbd,#mood,#pbub,#loader){--ink:#4A3F36;--soft:#8A7D70;--chip:#FBF8F3;--line:rgba(74,63,54,.12);color:#4A3F36}
body.night :is(#evP,#evRes,.evres,.story p,.hints){color:#4A3F36}body.night .hint{color:#F3ECE2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;pointer-events:none}
.title b{display:block;font-size:20px;letter-spacing:.04em}
.title span{font-size:13px;color:var(--soft)}
.tools{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(60,40,20,.08);transition:transform .15s,background .3s}
button:hover{transform:translateY(-1px)}
button.on{background:var(--accent);color:#fff;border-color:transparent}
.rooms{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-start;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rooms button:first-child{margin-left:auto}.rooms button:last-child{margin-right:auto}
.rooms button{flex:none;padding:9px 16px;font-size:15px}
.card{position:fixed;left:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:330px;background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 6px 20px rgba(60,40,20,.10);opacity:0;transform:translateY(8px);transition:.35s;pointer-events:none}
.card.show{opacity:.96;transform:none}
.card b{font-size:16px}
.card p{font-size:13px;line-height:1.6;color:var(--soft);margin-top:4px}
.card i{font-style:normal;display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;margin:4px 4px 0 0}
.c1{background:#DDEFE6;color:#2F7A5A}.c2{background:#F8E0E8;color:#B0486E}.c3{background:#FBE0DA;color:#C2412E}
.hint{position:fixed;right:16px;bottom:74px;font-size:12px;color:var(--soft);text-align:right}
/* 遊戲時鐘 */
.clock{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 2px 8px rgba(60,40,20,.08)}
.clock b{font-size:16px;font-variant-numeric:tabular-nums;min-width:3.2em}
.clock input{width:110px;accent-color:var(--accent)}
.clock button{box-shadow:none;padding:5px 10px}
/* 開場：只在一開始看外觀 */
#enter{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:17px;padding:12px 26px;background:var(--accent);color:#fff;border:none;box-shadow:0 8px 24px rgba(150,90,40,.28)}
body:not(.play) .hint,body:not(.play):not(.tutorial) .tools{display:none}.rooms{display:none!important}
/* 操作教學、提示、照顧進度 */
kbd{display:inline-block;min-width:1.7em;padding:1px 6px;margin:0 2px;border-radius:6px;background:#fff;border:1px solid #D8CFC3;border-bottom-width:3px;font:700 13px/1.4 system-ui,sans-serif;color:var(--ink);text-align:center}
.tbtn{display:inline-grid;place-items:center;width:30px;height:30px;vertical-align:middle;border-radius:50%;background:rgba(242,179,107,.35);font-size:18px;font-weight:400}
#tut{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 32px));background:var(--chip);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:0 10px 30px rgba(60,40,20,.14);display:none}
body.tutorial #tut{display:block}
#tut .h{display:flex;align-items:center;gap:10px}#tut .h b{font-size:16px;flex:1}
#tutN{display:flex;gap:5px}#tutN i{width:8px;height:8px;border-radius:50%;background:#E3D9CC}#tutN i.now{background:var(--accent)}#tutN i.ok{background:#7FB394}
#tut p{font-size:14px;line-height:1.75;color:var(--ink);margin-top:6px}
#tut .f{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#tutOk{color:#3E8A63;font-weight:700;opacity:0;transition:opacity .3s}#tutOk.show{opacity:1}
#tutSkip{font-size:13px;padding:5px 12px}
#ctx{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:none}
#ctx span{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:0 4px 12px rgba(60,40,20,.1);white-space:nowrap}
body:not(.tutorial):not(.play) #ctx,body.touch #ctx{display:none}
#stats{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));width:210px;background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:8px 12px 10px;box-shadow:0 6px 18px rgba(60,40,20,.10);display:none;font-size:12px}
body.tutorial #stats,body.play #stats{display:block}
.sg b{display:block;font-size:12px;color:var(--soft);margin:4px 0 2px}
.sr{position:relative;display:grid;grid-template-columns:18px 30px 1fr 38px;align-items:center;gap:5px;height:20px}
.si{font-size:13px}.sn{color:var(--ink)}.sv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.sb{height:8px;border-radius:8px;background:#EEE6DA;overflow:hidden}.sb i{display:block;height:100%;border-radius:8px;transition:width .25s}
.sb i.g{background:#7FB394}.sb i.m{background:#E8B65C}.sb i.l{background:#E0705A}
.sr.hit .sb{animation:hit .4s}@keyframes hit{30%{box-shadow:0 0 0 2px rgba(224,112,90,.5)}}
.pop{position:absolute;right:-30px;top:0;font-style:normal;font-weight:700;font-size:12px;animation:flo 1.3s ease-out forwards;pointer-events:none}
.pop.neg{color:#D2553D}.pop.pos{color:#3E8A63}@keyframes flo{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-16px)}}
#mood{position:fixed;left:0;top:0;transform:translate(-50%,-100%);width:52px;height:46px;border-radius:24px;background:#fff;display:none;place-items:center;font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(60,40,20,.18);pointer-events:none;z-index:15}
#pbub{position:fixed;transform:translate(-50%,-100%);font-size:13px;font-weight:700;color:#C2412E;background:#fff;border-radius:999px;padding:3px 9px;box-shadow:0 3px 10px rgba(60,40,20,.15);white-space:nowrap;display:none;pointer-events:none;z-index:15;animation:moodBob 1.2s ease-in-out infinite}#pbub.show{display:block}
#pbub.ok{color:#2F7A5A}
#dang{position:fixed;left:50%;transform:translateX(-50%);top:calc(132px + env(safe-area-inset-top,0px));background:#E0705A;color:#fff;border-radius:999px;padding:7px 16px;font-size:15px;box-shadow:0 6px 18px rgba(200,70,50,.35);display:none;z-index:25;animation:pulse 1s infinite}
#dang.show{display:block}#dang b{font-variant-numeric:tabular-nums;font-size:17px}
body.touch #dang{top:calc(50px + env(safe-area-inset-top,0px));font-size:13px}
#mood::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
#mood.show{display:grid}#mood.mini{box-shadow:0 0 0 3px #F4B740,0 4px 14px rgba(0,0,0,.18);animation:moodBob .8s ease-in-out infinite}#mood span{display:block;animation:moodPop .35s cubic-bezier(.2,.9,.3,1.5)}#mood.bob{animation:moodBob 1.6s ease-in-out infinite}
@keyframes moodPop{from{transform:scale(.3)}to{transform:none}}@keyframes moodBob{50%{margin-top:-5px}}
#prog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:max-content;min-width:220px;max-width:calc(100% - 32px);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#prog.show{opacity:1}#prog .bar{height:8px;border-radius:8px;background:#EDE3D6;margin-top:6px;overflow:hidden}#progF{height:100%;width:0;background:#E3A877;border-radius:8px}
#pause{position:fixed;inset:0;z-index:42;display:none;place-items:center;background:rgba(80,70,62,.4);backdrop-filter:blur(3px);padding:16px}
body.paused #pause{display:grid}.pbs{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:200px}.pbs .pri{background:var(--accent);color:#fff;border:none}
#pQuit.warn{background:#E0705A;color:#fff;border-color:transparent}
#pauseBtn{font-size:15px;padding:7px 12px}body:not(.play):not(.tutorial) #pauseBtn{display:none}
#ready{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(80,70,62,.35);backdrop-filter:blur(3px);padding:16px}
body.ready #ready{display:grid}
.rdy{background:#F6F2EC;border-radius:22px;padding:24px 26px;text-align:center;max-width:360px;box-shadow:0 18px 50px rgba(60,50,40,.22)}
.rdy b{font-size:22px}.rdy p{color:var(--soft);font-size:14px;line-height:1.7;margin:8px 0 16px}.rdy .bs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rdy .pri{background:var(--accent);color:#fff;border:none;font-size:15px;padding:10px 22px}
/* 手機：左邊半透明搖桿、右邊三顆指令鍵 */
#pad{display:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pad *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
body.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch.tutorial #pad,body.touch.play #pad{display:block}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(2px);touch-action:none;z-index:20}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 3px 10px rgba(0,0,0,.15);pointer-events:none}
.acts{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:170px;height:150px;z-index:20}
.acts button{position:absolute;width:74px;height:74px;font-size:36px!important;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.65);backdrop-filter:blur(2px);font-size:24px;line-height:1;box-shadow:none;touch-action:manipulation}
.acts button.lit{background:rgba(242,179,107,.85);border-color:#fff}
#bE{right:0;bottom:46px;width:88px;height:88px;font-size:44px!important}#bF{right:96px;bottom:0}#bQ{right:96px;bottom:84px}
#rot{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(246,242,236,.96);text-align:center;padding:24px}
@media (orientation:portrait){body.touch:not(.rotSeen).tutorial #rot,body.touch:not(.rotSeen).play #rot,body.touch:not(.rotSeen).ready #rot{display:grid}}
@media (max-height:500px){#stats{left:calc(12px + env(safe-area-inset-left,0px));right:auto;top:calc(8px + env(safe-area-inset-top,0px));width:170px;padding:4px 10px 6px;font-size:11px}.sr{height:16px;grid-template-columns:16px 26px 1fr 32px}.pop{right:-30px;left:auto}.title{display:none}#tut{left:calc(12px + env(safe-area-inset-left,0px));transform:none;top:calc(8px + env(safe-area-inset-top,0px));width:min(400px,48%);padding:8px 12px}
  #tut p{font-size:13px;line-height:1.6;margin-top:3px}#tut .f{margin-top:4px}.top{top:calc(8px + env(safe-area-inset-top,0px))}
  #wallBtn,#rotL,#rotR,#clockR{display:none}
  #joy{width:88px;height:88px}#knob{width:36px;height:36px;margin:-18px 0 0 -18px}.acts{transform:scale(.9);transform-origin:right bottom}}
#rot .ic{font-size:54px;animation:tilt 1.6s ease-in-out infinite}@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot b{display:block;font-size:19px;margin-top:10px}#rot p{color:var(--soft);font-size:14px;margin:6px 0 16px}
body:not(.intro) #enter{display:none}body:not(.play):not(.intro) .card{display:none}
/* (1) Loading：莫蘭迪灰藍底＋三隻小黃鴨 */
/* (2) 前情提要：手機訊息 */
#story{position:fixed;inset:0;z-index:45;display:none;place-items:center;background:rgba(80,70,62,.35);backdrop-filter:blur(4px);padding:16px}
body.story #story,body.ended:not(.over) #story{display:grid}
#backIsland{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));z-index:47;font-size:14px;padding:7px 14px;border-radius:999px;background:rgba(251,248,243,.92);color:#4A3F36;border:1px solid rgba(74,63,54,.12);text-decoration:none;box-shadow:0 2px 8px rgba(60,40,20,.08)}
body.play #backIsland,body.tutorial #backIsland,body.loading #backIsland{display:none}
#skipStory{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:46;display:none;background:rgba(251,248,243,.92);font-size:14px;padding:8px 18px;white-space:nowrap}
body.story #skipStory{display:block}
.phone{position:relative;width:340px;zoom:var(--pz,1);aspect-ratio:9/19;border-radius:46px;background:#2C3E55;padding:11px;box-shadow:0 30px 70px rgba(30,30,40,.35),inset 0 0 0 2px #3E5470;animation:rise .7s cubic-bezier(.2,.9,.3,1.1)}
.phone.buzz{animation:buzz .5s linear 2}
@keyframes rise{from{transform:translateY(60vh) rotate(6deg)}to{transform:none}}
@keyframes buzz{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-1.5deg)}40%{transform:translateX(5px) rotate(1.5deg)}60%{transform:translateX(-4px) rotate(-1deg)}80%{transform:translateX(4px) rotate(1deg)}}
.phone::before,.phone::after{content:"";position:absolute;background:#22344A;border-radius:3px}
.phone::before{left:-4px;top:22%;width:4px;height:9%}.phone::after{right:-4px;top:28%;width:4px;height:13%}
.scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#000;color:#fff;font-size:14px}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:42%;height:24px;background:#2C3E55;border-radius:0 0 16px 16px;z-index:5}
.notch::after{content:"";position:absolute;left:50%;top:9px;transform:translateX(-50%);width:34%;height:4px;border-radius:4px;background:#14202E}
/* 鎖定畫面 */
.lock{position:absolute;inset:0;background:linear-gradient(160deg,#F2C8B8 0%,#C9A7C7 45%,#8FA6C9 100%);display:flex;flex-direction:column;align-items:center;padding-top:62px;transition:opacity .4s}
.lock .t{font-size:58px;font-weight:700;letter-spacing:.02em;line-height:1}.lock .d{font-size:14px;opacity:.9;margin-top:6px}
.noti{margin-top:28px;width:88%;background:rgba(255,255,255,.72);color:#2A2A2E;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border:none;font:inherit;text-align:left;box-shadow:0 8px 20px rgba(0,0,0,.12);transform:translateY(-140px);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.noti.in{transform:none;opacity:1}.noti:focus-visible{outline:2px solid #fff}
.noti .tx{flex:1;min-width:0}.noti b{font-size:13px}.noti small{float:right;font-size:11px;opacity:.6}.noti p{font-size:13px;margin-top:2px;line-height:1.4}
.hintTap{margin-top:auto;margin-bottom:34px;font-size:13px;opacity:0;transition:opacity .4s}.hintTap.in{opacity:.9;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
.ava{flex:none;width:34px;height:34px;border-radius:50%;background:#E9A9A3;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
/* 聊天室 */
.chat{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s}
.chat.in{opacity:1;pointer-events:auto}
.ch{display:flex;align-items:center;gap:10px;padding:32px 14px 10px;border-bottom:1px solid #1C1C1E}
.ch .nm{flex:1;min-width:0}.ch .nm b{display:block;font-size:15px}.ch .nm span{font-size:11px;color:#8E8E93}
.ch svg{width:22px;height:22px;flex:none}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.day{align-self:center;font-size:11px;color:#8E8E93;margin:4px 0 6px}
.row{display:flex;align-items:flex-end;gap:7px;animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
.row.me{justify-content:flex-end}.row .ava{width:26px;height:26px;font-size:12px}.row.cont .ava{visibility:hidden}
.bub{max-width:76%;padding:8px 13px;border-radius:19px;line-height:1.45;font-size:14px;word-break:break-word}
.them .bub{background:#2F2F33}.me .bub{background:#1E8BFF}
.seen{align-self:flex-end;font-size:10px;color:#8E8E93;margin-top:-2px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.typing .bub{display:flex;gap:4px;padding:12px 14px}.typing i{width:7px;height:7px;border-radius:50%;background:#8E8E93;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.choices{display:flex;flex-direction:column;gap:7px;padding:0 12px 8px}
.choices button{background:#1C1C1E;color:#fff;border:1px solid #3A3A3C;border-radius:16px;padding:10px 12px;font-size:14px;text-align:left;box-shadow:none;animation:pop .3s}
.choices button.yes{border-color:#1E8BFF;color:#7CC0FF}
.bar2{display:flex;align-items:center;gap:8px;padding:8px 10px 18px}
.bar2 svg{width:22px;height:22px;flex:none}
.field{flex:1;min-width:0;background:#1C1C1E;border-radius:18px;padding:8px 12px;font-size:14px;color:#8E8E93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field.ready{color:#fff}
.send{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:#1E8BFF;color:#fff;display:grid;place-items:center;padding:0;box-shadow:none;opacity:.35;pointer-events:none}
.send.on{opacity:1;pointer-events:auto;animation:pulse 1.2s infinite}
/* 遊戲結束 */
#ending{position:fixed;inset:0;z-index:48;display:none;place-items:center;background:rgba(60,52,46,.6);backdrop-filter:blur(4px);padding:16px}
body.ended #ending{display:grid}
.endc{background:#F6F2EC;border-radius:22px;padding:26px 28px;text-align:center;max-width:340px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.endc b{font-size:24px}.endc p{color:var(--soft);font-size:14px;line-height:1.7;margin:8px 0 16px}
.endc button{background:var(--accent);color:#fff;border:none;font-size:15px;padding:10px 24px}
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#FFEAD3;transition:opacity .7s}
#loader.done{opacity:0;pointer-events:none}
.ld{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(460px,86vw)}

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="js/characters.js"></script>
<script>
// =====================================================================
//  幫 Linda 照顧小孩：場景精修版（只有場景，還沒有遊戲玩法）
//  座標和原本的遊戲一樣：房子 x -8~8、z -6~6，地板高度 y=0
//  z 是負的那邊是後牆，z 是正的那邊是大門
// =====================================================================
const $=id=>document.getElementById(id);
THREE.ColorManagement.legacyMode=false;          // 讓色碼看起來跟設計稿一樣
const canvas=$("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();

// ---------- 攝影機：正交（斜角俯視，遠近一樣大） ----------
const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,200);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.09;
controls.minZoom=.55;controls.maxZoom=5;controls.minPolarAngle=.35;controls.maxPolarAngle=1.22;
controls.screenSpacePanning=false;
let VIEW=7.4;
function resize(){const w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);
  VIEW=a<1.25?8.6*1.25/a:7.4;camera.left=-VIEW*a;camera.right=VIEW*a;camera.top=VIEW;camera.bottom=-VIEW;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

// ---------- 光線 ----------
const hemi=new THREE.HemisphereLight(0xFFF7EE,0xD8C8B4,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xFFF0DD,1.55);sun.position.set(-5,15,9);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-17,right:17,top:17,bottom:-17,near:1,far:50});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;scene.add(sun);
const fill=new THREE.DirectionalLight(0xE8EEFF,.35);fill.position.set(8,6,-6);scene.add(fill);

// ---------- 小工具 ----------
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const MC={};
function M(c,o={}){if(c&&c.isMaterial)return c;const k=c+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:0,...o}))}
let CAPTURE=null;
function add(m,p){m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);if(CAPTURE)CAPTURE.push(m);return m}
const GC={};
function rgeo(w,h,d,r){const k=[w,h,d,r].map(v=>v.toFixed(3)).join();return GC[k]||(GC[k]=new THREE.RoundedBoxGeometry(w,h,d,3,r))}
// rbox = 圓角方塊（y 是底部的高度）
function rbox(w,h,d,c,x,y,z,p,r=.03){r=Math.min(r,Math.min(w,h,d)/2-.002);
  const g=r>.004?rgeo(w,h,d,r):new THREE.BoxGeometry(w,h,d);const m=add(new THREE.Mesh(g,M(c)),p);m.position.set(x,y+h/2,z);return m}
function box(w,h,d,c,x,y,z,p){const m=add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c)),p);m.position.set(x,y+h/2,z);return m}
function cyl(rt,rb,h,c,x,y,z,p,s=24){const m=add(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),M(c)),p);m.position.set(x,y+h/2,z);return m}
function sph(r,c,x,y,z,p,sx=1,sy=1,sz=1){const m=add(new THREE.Mesh(new THREE.SphereGeometry(r,24,16),M(c)),p);m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m}
function grp(x=0,y=0,z=0,ry=0,p){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;(p||scene).add(g);return g}
function rod(a,b,r,c,p){// 兩點之間的細棍子
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),L=A.distanceTo(B);
  const m=add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,10),M(c)),p);m.position.copy(A).lerp(B,.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());return m}

// ---------- 程式畫的材質貼圖（木地板、地毯、大理石…） ----------
function ctex(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
const hex=c=>"#"+c.toString(16).padStart(6,"0");
function shade(c,k){const col=new THREE.Color(c);const hsl={};col.getHSL(hsl);col.setHSL(hsl.h,hsl.s,Math.max(0,Math.min(1,hsl.l+k)));return "#"+col.getHexString()}
function noise(x,w,h,n,a){for(let i=0;i<n;i++){x.fillStyle=rnd()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;x.fillRect(rnd()*w,rnd()*h,2,2)}}
// 木地板：一張貼圖代表 2.4 公尺見方
function woodTex(base,plank=.2){return ctex(1024,1024,(x,w,h)=>{const rows=Math.round(2.4/plank),rh=h/rows;
  for(let r=0;r<rows;r++){let u=-rnd()*400;while(u<w){const L=380+rnd()*520;x.fillStyle=shade(base,(rnd()-.5)*.07);x.fillRect(u,r*rh,L,rh);
    for(let g=0;g<7;g++){x.strokeStyle=`rgba(80,50,30,${.04+rnd()*.05})`;x.lineWidth=1+rnd()*1.5;x.beginPath();const y0=r*rh+rnd()*rh;x.moveTo(u,y0);
      for(let s=0;s<=L;s+=40)x.lineTo(u+s,y0+Math.sin(s*.02+g)*2);x.stroke()}
    x.fillStyle="rgba(60,35,20,.28)";x.fillRect(u,r*rh,2,rh);u+=L}
    x.fillStyle="rgba(60,35,20,.25)";x.fillRect(0,r*rh,w,2)}})}
function floorMat(base,w,d,plank){const t=woodTex(base,plank);t.repeat.set(w/2.4,d/2.4);return new THREE.MeshStandardMaterial({map:t,roughness:.62})}
function knitTex(base){return ctex(512,512,(x,w,h)=>{x.fillStyle=hex(base);x.fillRect(0,0,w,h);
  for(let j=0;j<h;j+=8)for(let i=0;i<w;i+=8){x.fillStyle=`rgba(255,255,255,${.12+rnd()*.12})`;x.beginPath();x.ellipse(i+4,j+4,3,2.4,0,0,7);x.fill();
    x.fillStyle=`rgba(90,70,50,${.05+rnd()*.06})`;x.fillRect(i,j+7,8,1)}noise(x,w,h,6000,.05)})}
function dotsTex(){return ctex(512,384,(x,w,h)=>{x.fillStyle="#F6EEE3";x.fillRect(0,0,w,h);noise(x,w,h,4000,.04);
  const cols=["#F3C7A5","#BFE0D3","#F6DE9C","#BBD7EC","#F2B8B0"];
  for(let i=0;i<26;i++){x.fillStyle=cols[i%5];x.globalAlpha=.85;x.beginPath();x.arc(30+rnd()*(w-60),30+rnd()*(h-60),16+rnd()*30,0,7);x.fill()}x.globalAlpha=1})}
function stripeTex(){return ctex(512,384,(x,w,h)=>{x.fillStyle="#EFE9E0";x.fillRect(0,0,w,h);noise(x,w,h,5000,.05);
  x.strokeStyle="rgba(120,110,100,.45)";x.lineWidth=3;for(let i=1;i<6;i++){const m=i*26;x.beginPath();x.roundRect(m,m,w-2*m,h-2*m,h/2-m);x.stroke()}})}
function juteTex(){return ctex(256,256,(x,w,h)=>{x.fillStyle="#B98E5E";x.fillRect(0,0,w,h);
  for(let j=0;j<h;j+=16)for(let i=0;i<w;i+=16){const o=((i+j)/16)%2;x.fillStyle=o?"#C99D6B":"#A87F52";x.beginPath();x.roundRect(i+2,j+2,o?12:12,o?12:12,4);x.fill()}noise(x,w,h,3000,.06)})}
function concreteTex(base){return ctex(512,512,(x,w,h)=>{x.fillStyle=hex(base);x.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){const g=x.createRadialGradient(0,0,0,0,0,40+rnd()*90);const a=.035+rnd()*.04,d=rnd()<.5;
    g.addColorStop(0,d?`rgba(90,90,90,${a})`:`rgba(255,255,255,${a})`);g.addColorStop(1,"rgba(0,0,0,0)");x.save();x.translate(rnd()*w,rnd()*h);x.fillStyle=g;x.fillRect(-140,-140,280,280);x.restore()}
  noise(x,w,h,9000,.04)})}
function marbleTex(){return ctex(512,512,(x,w,h)=>{x.fillStyle="#F6F4F1";x.fillRect(0,0,w,h);x.filter="blur(1.2px)";
  for(let i=0;i<14;i++){x.strokeStyle=`rgba(150,145,140,${.12+rnd()*.18})`;x.lineWidth=.6+rnd()*2;x.beginPath();let px=rnd()*w,py=0;x.moveTo(px,py);
    while(py<h){px+=(rnd()-.5)*60;py+=20+rnd()*30;x.lineTo(px,py)}x.stroke()}x.filter="none"})}
function artTex(){return ctex(256,320,(x,w,h)=>{x.fillStyle="#EEE8DF";x.fillRect(0,0,w,h);
  x.fillStyle="#C9BBA8";x.beginPath();x.arc(170,110,60,0,7);x.fill();x.fillStyle="#2E2B29";x.beginPath();x.arc(90,190,58,Math.PI,0);x.fill();
  x.fillStyle="#D9D0C3";x.fillRect(40,220,170,60);x.strokeStyle="#2E2B29";x.lineWidth=4;x.beginPath();x.arc(150,240,40,Math.PI*1.1,Math.PI*1.9);x.stroke()})}
function glowTex(){return ctex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.35,"rgba(255,255,255,.35)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,w,h)})}
const texMat=(t,o={})=>new THREE.MeshStandardMaterial({map:t,roughness:.9,...o});
const MARBLE=texMat(marbleTex(),{roughness:.35});
const STEEL=M(0xC9CDD0,{metalness:.55,roughness:.32}),STEEL2=M(0xB7BCC0,{metalness:.6,roughness:.3});
const GOLD=M(0xC9A15B,{metalness:.75,roughness:.3}),BLACKM=M(0x232222,{metalness:.4,roughness:.45});
const GLASS=new THREE.MeshStandardMaterial({color:0xDCEFF7,emissive:0xEAF5FB,emissiveIntensity:.55,transparent:true,opacity:.5,roughness:.08,depthWrite:false});
const CLEAR=new THREE.MeshStandardMaterial({color:0xE8F2F4,transparent:true,opacity:.22,roughness:.05,depthWrite:false});
function rug(x,z,w,d,mat,r=.08,ry=0){const m=add(new THREE.Mesh(rgeo(w,.025,d,Math.min(r,.0105)),mat));m.position.set(x,.0125,z);m.rotation.y=ry;m.castShadow=false;return m}
function roundRug(x,z,r,mat){const m=add(new THREE.Mesh(new THREE.CylinderGeometry(r,r,.03,48),mat));m.position.set(x,.015,z);m.castShadow=false;return m}
// 柔和光暈：貼在燈和窗戶上的發光小圖
const GLOWT=glowTex(),GLOWS=[];
function glow(x,y,z,s,c,day=.0,night=.85,p){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOWT,color:c,transparent:true,opacity:day,depthWrite:false,blending:THREE.AdditiveBlending}));
  sp.position.set(x,y,z);sp.scale.set(s,s,s);(p||scene).add(sp);GLOWS.push({sp,day,night});if(CAPTURE)CAPTURE.push(sp);return sp}
const LAMPS=[];// 傍晚會亮的燈
function lamp(x,y,z,c=0xFFC98A,dist=5.5,power=1.3){const l=new THREE.PointLight(c,0,dist,2);l.position.set(x,y,z);scene.add(l);LAMPS.push({l,power});return l}
const EMIS=[];// 燈罩在傍晚會更亮
function emis(c,day=.35,night=1.6){const m=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:day,roughness:.6});EMIS.push({m,day,night});return m}

// =====================================================================
//  房子：地板、外牆、隔間牆（牆會自動降低，讓你看得到裡面）
// =====================================================================
const H=2.5,T=.16,SH=.22;
const WALLC={living:0xEADFCF,kitchen:0xEDE5DA,nursery:0xF5ECE2,master:0xE6D7C4,outside:0xF7F6F2};
const wallMats={};
for(const k in WALLC)wallMats[k]=new THREE.MeshStandardMaterial({color:WALLC[k],roughness:.95,map:concreteTex(WALLC[k])});
wallMats.bath=new THREE.MeshStandardMaterial({color:0xC9C6C1,roughness:.9,map:concreteTex(0xB8B5B0)});
const CAP=M(0xFBF8F3),CAPLOW=M(0xF4EEE6);
const WALLS=[];
// axis "x"：沿著 x 方向的牆（在 z=pos）；axis "z"：沿著 z 方向的牆（在 x=pos）
// sides：[負的那一側房間, 正的那一側房間]；doors：[起,迄]；wins：[起,迄,窗台高,窗頂高]
const WALLBY={};
function wall(axis,pos,a,b,sides,{doors=[],wins=[],outer=0,name}={}){
  const full=new THREE.Group(),stub=new THREE.Group();scene.add(full);scene.add(stub);
  const [negM,posM]=sides.map(s=>wallMats[s]);
  const mats=axis==="x"?[CAP,CAP,CAP,CAP,posM,negM]:[posM,negM,CAP,CAP,CAP,CAP];
  const piece=(u0,u1,y0,y1,g,th=T,mm=mats)=>{const L=u1-u0,hh=y1-y0;
    const geo=axis==="x"?new THREE.BoxGeometry(L,hh,th):new THREE.BoxGeometry(th,hh,L);
    const m=add(new THREE.Mesh(geo,mm),g);const u=(u0+u1)/2;
    if(axis==="x")m.position.set(u,y0+hh/2,pos);else m.position.set(pos,y0+hh/2,u);return m};
  const ops=[...doors.map(d=>({a:d[0],b:d[1],door:1})),...wins.map(w=>({a:w[0],b:w[1],y0:w[2],y1:w[3]}))].sort((p,q)=>p.a-q.a);
  let cur=a;
  ops.forEach(o=>{if(o.a>cur)piece(cur,o.a,0,H,full);
    if(o.door){piece(o.a,o.b,2.12,H,full)}
    else{piece(o.a,o.b,0,o.y0,full);piece(o.a,o.b,o.y1,H,full);
      // 玻璃和白色窗框
      const gl=piece(o.a,o.b,o.y0,o.y1,full,.02,GLASS);gl.castShadow=false;
      const F=M(0xFAFAF8),fw=.05;
      piece(o.a,o.b,o.y0,o.y0+fw,full,T+.03,F);piece(o.a,o.b,o.y1-fw,o.y1,full,T+.03,F);
      piece(o.a,o.a+fw,o.y0,o.y1,full,T+.03,F);piece(o.b-fw,o.b,o.y0,o.y1,full,T+.03,F);
      const mid=(o.a+o.b)/2;piece(mid-.02,mid+.02,o.y0,o.y1,full,T+.02,F);
      if(o.y1-o.y0>1.1)piece(o.a,o.b,(o.y0+o.y1)/2-.02,(o.y0+o.y1)/2+.02,full,T+.02,F)}
    cur=Math.max(cur,o.b)});
  if(cur<b)piece(cur,b,0,H,full);
  // 外牆：深灰色牆腳＋深色窗框（像參考圖）
  if(outer){const os=sides[0]==="outside"?-1:1,DK=M(0x2E3134,{roughness:.6});
    const skin=(u0,u1,y0,y1,th,off,G=full)=>{const L=u1-u0,hh=y1-y0,o=os*(T/2+off);const g=axis==="x"?new THREE.BoxGeometry(L,hh,th):new THREE.BoxGeometry(th,hh,L);
      const m=add(new THREE.Mesh(g,DK),G);const u=(u0+u1)/2;if(axis==="x")m.position.set(u,y0+hh/2,pos+o);else m.position.set(pos+o,y0+hh/2,u);return m};
    let c2=a;doors.slice().sort((p,q)=>p[0]-q[0]).forEach(d=>{if(d[0]>c2)skin(c2,d[0],0,.36,.02,.01);c2=d[1]});if(c2<b)skin(c2,b,0,.36,.02,.01);
    c2=a;doors.slice().sort((p,q)=>p[0]-q[0]).forEach(d=>{if(d[0]>c2)skin(c2,d[0],0,SH-.02,.02,.008,stub);c2=d[1]});if(c2<b)skin(c2,b,0,SH-.02,.02,.008,stub);
    wins.forEach(([u0,u1,y0,y1])=>{const f=.06;skin(u0-f,u1+f,y1,y1+f,.05,.025);skin(u0-f,u1+f,y0-f,y0,.07,.035);skin(u0-f,u0,y0,y1,.05,.025);skin(u1,u1+f,y0,y1,.05,.025);skin((u0+u1)/2-.02,(u0+u1)/2+.02,y0,y1,.04,.02)})}
  // 矮牆（牆降下來的時候看到的那一段）
  const solid=[];cur=a;doors.slice().sort((p,q)=>p[0]-q[0]).forEach(d=>{if(d[0]>cur)solid.push([cur,d[0]]);cur=d[1]});if(cur<b)solid.push([cur,b]);
  const smats=mats.map(m=>m===CAP?CAPLOW:m);
  solid.forEach(([u0,u1])=>piece(u0,u1,0,SH,stub,T-.006,smats));
  const rec={axis,pos,a,b,full,s:1,outer,doors};WALLS.push(rec);if(name)WALLBY[name]=rec;return rec;
}
// =====================================================================
//  家具小工具（每一種家具都是一個 function，可以重複使用）
// =====================================================================
const WAL=0x6E4A33,OAK=0xD6B183,BIRCH=0xE7D1AA,SOFA=0xC9C4BD,SOFA2=0xD3CEC7,KW=0xF7F5F1;
const RAINBOW=[0x7B5EA7,0x3F7CC6,0x55A85A,0xF2C443,0xF08A3A,0xE1483F];
const JUTE=texMat(juteTex());
function leafGeo(len,wid){const s=new THREE.Shape();s.moveTo(0,0);s.quadraticCurveTo(wid,len*.45,0,len);s.quadraticCurveTo(-wid,len*.45,0,0);return new THREE.ShapeGeometry(s,6)}
const LEAFM=[0x4F7D45,0x5C8C4E,0x456F3D].map(c=>M(c,{side:THREE.DoubleSide,roughness:.7}));
function leaf(len,wid,y,yaw,tilt,p,mi=0){const piv=new THREE.Group();piv.position.y=y;piv.rotation.y=yaw;p.add(piv);
  const m=add(new THREE.Mesh(leafGeo(len,wid),LEAFM[mi%3]),piv);m.rotation.x=-tilt;return m}
function potPlant(x,y,z,p,s=1,pot=0xEDE8E0){const g=grp(x,y,z,0,p);g.scale.setScalar(s);
  cyl(.13,.1,.2,pot,0,0,0,g,20);cyl(.12,.12,.01,0x5A4636,0,.19,0,g,16);
  for(let i=0;i<9;i++)leaf(.22+rnd()*.12,.07,.19,i*2.4,.35+rnd()*.6,g,i);return g}
function bigPlant(x,z,s=1){const g=grp(x,0,z,0);g.scale.setScalar(s);
  cyl(.26,.2,.46,0xDAD4CB,0,0,0,g,28);cyl(.24,.24,.01,0x5A4636,0,.44,0,g,20);
  for(let i=0;i<10;i++){const a=i*2.39,h=.9+rnd()*.9,r=.08+rnd()*.12;
    rod([0,.44,0],[Math.cos(a)*r,h,Math.sin(a)*r],.012,0x5F7F48,g);
    const piv=grp(Math.cos(a)*r,h,Math.sin(a)*r,-a+Math.PI/2,g);const m=add(new THREE.Mesh(leafGeo(.75+rnd()*.3,.2),LEAFM[i%3]),piv);m.rotation.x=-(.35+rnd()*.5)}
  return g}
function curtain(axis,pos,u0,u1,h,color,op=1){const n=Math.max(3,Math.round((u1-u0)/.075)),r=(u1-u0)/n*.75;
  const mat=op<1?new THREE.MeshStandardMaterial({color,roughness:.95,transparent:true,opacity:op,side:THREE.DoubleSide}):M(color,{roughness:.95});
  for(let i=0;i<n;i++){const u=u0+(i+.5)*(u1-u0)/n,m=add(new THREE.Mesh(new THREE.CylinderGeometry(r,r*1.15,h,10,1,true),mat));
    if(axis==="z")m.position.set(pos,2.32-h/2,u);else m.position.set(u,2.32-h/2,pos);m.scale.set(axis==="z"?.55:1,1,axis==="z"?1:.55);if(op<1)m.castShadow=false}}
function lowShelf(g,w,h,d,c){[-1,1].forEach(s=>rbox(.035,h,d,c,s*(w/2-.0175),0,0,g,.008));

const GS=.25,GX0=-8,GZ0=-6,GW=64,GH=48;let GRID=null;
function gridInit(){GRID=new Uint8Array(GW*GH);for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)GRID[j*GW+i]=blocked(GX0+(i+.5)*GS,GZ0+(j+.5)*GS,.12)?0:1}
const cellOf=(x,z)=>[Math.max(0,Math.min(GW-1,Math.floor((x-GX0)/GS))),Math.max(0,Math.min(GH-1,Math.floor((z-GZ0)/GS)))];
function pathTo(x,z){if(!GRID)gridInit();const [si,sj]=cellOf(baby.position.x,baby.position.z),[ti,tj]=cellOf(x,z);
  const prev=new Int32Array(GW*GH).fill(-1),st=sj*GW+si,q=[st];prev[st]=st;let found=-1,best=st,bd2=1e9;
  for(let k=0;k<q.length;k++){const c=q[k],ci=c%GW,cj=(c/GW)|0,d=Math.abs(ci-ti)+Math.abs(cj-tj);if(d<bd2){bd2=d;best=c}if(d===0){found=c;break}
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const ni=ci+di,nj=cj+dj;if(ni<0||nj<0||ni>=GW||nj>=GH)continue;const n=nj*GW+ni;if(prev[n]>=0||!GRID[n])continue;prev[n]=c;q.push(n)}}
  let c=found>=0?found:best;const pts=[];while(prev[c]!==c){pts.push([GX0+(c%GW+.5)*GS,GZ0+(((c/GW)|0)+.5)*GS]);c=prev[c]}pts.reverse();if(found>=0)pts.push([x,z]);return pts}
const CARE_K=new Set(["feed","soothe","mini","diaper"]);
const playerBusy=()=>!!(G.rest||(G.action&&!CARE_K.has(G.action.s.k)));
function openHaz(){const o=activeHaz().filter(h=>!G.protected[h.k]);return o.length>1?o.filter(h=>h!==B.last):o}
function chooseTarget(busy){const open=openHaz();
  const pH=!open.length?0:busy?.92:.7+.2*Math.min(1,(gameMin-DAY_START)/600);   // 危險區沒處理，他空閒就會往那裡爬；你在忙的時候幾乎一定去
  if(Math.random()<pH){const h=open[Math.floor(Math.random()*open.length)];B.target=h;B.path=pathTo(h.x,h.z);
    if(busy&&(G.sneakT||0)<=0){G.sneakT=20;toast("👀 小麻糬趁你在忙，往危險的地方衝過去了！",2200)}}
  else{const t=TOYS[Math.floor(Math.random()*TOYS.length)];B.target=null;B.path=pathTo(t[0]+(Math.random()-.5)*.5,t[1]+(Math.random()-.5)*.5)}

  if(G.carry||G.asleep){if(B.state==="danger")clearDanger();if(B.state==="move")B.state="idle";B.crawling=false;return}
  if((G.action&&CARE_K.has(G.action.s.k)&&babyNear(1.8))||G.crying){B.crawling=false;if(B.state==="move")B.state="idle";return}          // 正在被照顧的時候乖乖不動
  B.crawling=false;const busy=playerBusy();
  if(busy&&B.state==="idle"&&B.t>.6)B.t=.6;                                       // 你一忙，他馬上開始動
  if(busy&&B.state==="move"&&!B.target&&openHaz().length)chooseTarget(true);      // 本來在玩玩具，也改去危險的地方
  if(B.state==="idle"){B.t-=dt;if(B.t<=0)chooseTarget(busy)}

  endRest();G.moveTo=null;G.keys={};G.running=false;G.holdKey=false;if(G.action)holdBreak();

    const d=c.neutral?"":deltaText(c);b.innerHTML=`<span>${c.t}</span>${d?`<small>${d}</small>`:""}`;b.onclick=()=>pickChoice(i);box.appendChild(b)})}
function addTip(t){if(t&&!RUN.tips.includes(t))RUN.tips.push(t)}
function pickChoice(i){const ev=G.ev,c=ev.choices[i],e=ev.e;
  if(e.emergency&&!c.ok){// 緊急事件選錯：說明原因、扣耐心，馬上重選
    ev.wrong.add(i);const wp=rv(e.wrongPat)||15;applyDelta({you:{pat:-wp}});bump("bad");
    $("evW").hidden=false;$("evW").innerHTML=`❌ ${c.why}<br><small>耐心 −${wp}，冷靜下來，再選一次！</small>`;renderChoices();return}
  {const em=RUN.emergency;ev.pend.unshift(()=>{const o=RUN.emergency;RUN.emergency=em;applyDelta(c);RUN.emergency=o})}if(!c.neutral)bump(c.ok?"good":"bad");
  if(!c.neutral&&!e.emergency&&!e.adult){if(!c.ok||c.lazy)RUN.fuss=Math.min(5,(RUN.fuss||0)+1);else RUN.fuss=Math.max(0,(RUN.fuss||0)-.5)}// 偷懶會讓小麻糬更愛鬧
  if(c.tag)RUN.tags.add(c.tag);if(c.untag)RUN.tags.delete(c.untag);if(c.then)c.then();

  if(c.baby&&c.baby.diaper==="=100")bump("diaper");

  if(c.cry)ev.pend.push(()=>startCry("",c.cry));else if(c.ok&&!c.neutral&&(c.baby&&c.baby.mood>0||c.sleep))ev.pend.push(()=>{if(!G.asleep)setMood("happy")});
  if(e.id==="play"||ev.id==="play")bump("play");
  if(c.min)ev.ff=c.min;
  if(c.next)ev.next=c.next;
  const tip=c.tip||(e.tip&&(c.ok||!e.emergency)?e.tip:null);addTip(tip);
  $("evC").hidden=true;$("evW").hidden=true;$("evR").hidden=false;

$("evOk").onclick=()=>{const ev=G.ev;if(!ev)return;G.ev=null;G.evCD=TUNE.evCool;RUN.emergency=false;document.body.classList.remove("event");

// 事件的數值：不會讓遊戲直接結束（最低停在 5，緊急事件時耐心最低 10）
function applyDelta(c){const fl=RUN.emergency?10:5;
  for(const [k,v] of Object.entries(c.you||{})){const nv=v<0?Math.max(Math.min(ST[k],fl),ST[k]+v):ST[k]+v;addStat(k,nv-ST[k])}
  for(const [k,v] of Object.entries(c.baby||{})){if(typeof v==="string"){addStat(k,+v.slice(1)-ST[k]);continue}const nv=v<0?Math.max(Math.min(ST[k],5),ST[k]+v):ST[k]+v;addStat(k,nv-ST[k])}}
// 時間快轉：時鐘往前跳，小麻糬的需要照樣下降（最低停在 15）
function fastForward(min){const drop=(k,v)=>{const nv=Math.max(Math.min(ST[k],15),ST[k]-v);addStat(k,nv-ST[k])};
  drop("food",TUNE.food*min*(G.asleep?.5:1));drop("diaper",TUNE.diaper*min*(G.asleep?.5:1));drop("mood",TUNE.moodDrop*min*.5);
  if(G.asleep)addStat("energy",TUNE.sleepGain*min);else drop("energy",TUNE.energy*min);
  G.ff=(G.ff||0)+min;if(min>=5)toast("⏩ 時間過得好快……",1600)}
// 每一格：檢查有沒有該發生的事件、一天結束了沒
function storyTick(dt){if(FLOW.step!=="play"||G.paused)return;
  if(G.ff>0){const s=Math.min(G.ff,dt*90);gameMin=Math.min(DAY_END,gameMin+s);G.ff-=s}
  if(G.ev)return;
  if(RUN.reportDrain)addStat("pat",-.2*dt);
  if(gameMin>=DAY_END&&!G.ff){endDay();return}
  G.evCD-=dt;miniTick(dt);if(G.action||B.state==="danger"||G.ff>0)return;
  if(babyTick(dt))return;
  const qi=RUN.queue.findIndex(x=>gameMin>=x.at);if(qi>=0){const q=RUN.queue.splice(qi,1)[0];openEvent(q.id);return}
  for(const id in EV){const e=EV[id];if(e.day!==RUN.day||RUN.done.has(id))continue;if(gameMin<rv(e.at))continue;
    RUN.done.add(id);if(e.cond&&!e.cond())continue;openEvent(id);return}}

  dayProps();gameMin=DAY_START;$("dayN").textContent=`第${n}天`;
  if(n===1){setStep("play");toast(`${roleName()}，加油！撐到 18:00 Linda 回家就過關！`,3200)}
  else{showSheet(`<h2>${DAYINFO[n].t}</h2><p class="lead">${DAYINFO[n].p}</p><div class="sbs"><button class="pri" id="sgo">開始 →</button></div>`);setStep("sheet");$("sgo").onclick=()=>{hideSheet();setStep("play")}}}
function endDay(){clearDanger();stopCry();G.action=null;$("prog").classList.remove("show");if(RUN.day<3)daySummary();else finalEnding()}
// 評分（只在結算時算）
const TITLES={3:"Linda 的神",2:"手忙腳亂但沒放棄",1:"有呼吸就好，大家都還活著"};
function rate(s){const mood=s.moodN?s.moodSum/s.moodN:70,ch=s.good+s.bad?s.good/(s.good+s.bad):.7;
  const sc=mood*.5+ch*30+Math.min(12,s.rescue*2+s.secure*1.5)+8-Math.min(18,s.cry/15)-s.bad*1.5;return sc>=72?3:sc>=50?2:1}
const stars=n=>"⭐".repeat(n)+'<span class="dim">'+"⭐".repeat(3-n)+"</span>";
function statGrid(s){const it=[["🍼","餵奶",s.feed],["🧷","換尿布",s.diaper],["💤","哄睡",s.sleep],["🤗","安撫",s.soothe],["🧸","陪玩",s.play],["🛡️","做好防護",s.secure],["🚨","救援",s.rescue],["😭","大哭",Math.round(s.cry)+" 秒"]];
  return `<div class="sgrid">${it.map(([ic,n,v],i)=>`<div style="animation-delay:${i*.08}s"><span>${ic}</span><b>${v}</b><small>${n}</small></div>`).join("")}</div>`}
function daySummary(){const s=RUN.stats,r=rate(s),n=RUN.day;
  const hints=[];if(hasTag("奶奶不放心"))hints.push("💬 奶奶好像不太放心……");if(hasTag("明天要交報告")||hasTag("報告搞砸了"))hints.push("💼 明天一早，工作的事還沒完……");
  if(hasTag("答應回電給陳太太")||hasTag("陳太太很擔心"))hints.push("📞 陳太太的事還掛在心上……");
  hints.push(n===1?"🚪 明天，好像會有人上門……":"🌡️ 明天的小麻糬……好像不太對勁。");
  showSheet(`<h2>🌙 第 ${n} 天，撐過去了！</h2><p class="lead">Linda 傳來訊息：「今天辛苦了！${n===1?"小麻糬有沒有很皮？":"明天是最後一天了，拜託你了 🙏"}」</p>
    ${statGrid(s)}<div class="title2">今日稱號：<b>${TITLES[r]}</b> ${stars(r)}</div>
    <div class="hints">${hints.map(h=>`<p>${h}</p>`).join("")}<p class="warn">明天你的體力和耐心只剩 ${DAYSTART[n+1].sta}……</p></div>
    <div class="sbs"><button id="sRun">趕緊逃跑</button><button class="pri" id="sNext">再幫 Linda 顧一天 →</button></div>`);
  setStep("sheet");$("sNext").onclick=()=>{hideSheet();startDay(n+1)};$("sRun").onclick=()=>escapeEnding(n)}
function escapeEnding(n){const txt=n===1?
  `<p>你一邊穿鞋一邊打字：「Linda 我突然想起我家瓦斯沒關！」（你家是電磁爐）</p><p>小麻糬在背後「啊～」了一聲，你頭也不回地衝下樓。</p><p>你直接把手機轉靜音，先裝死再說。</p>`:
  `<p>送走鄰居、爺爺奶奶、還接了工作電話……你癱在沙發上，用最後的力氣打字：</p><p>「Linda，我覺得我的靈魂已經先回家了，身體等等跟上 🫠」</p><p>Linda：「我懂……那種感覺我已經持續三個月了 🥲 謝謝你撐了兩天！」</p>`;
  showSheet(`<h2>🏃 逃跑結局</h2><div class="story">${txt}</div><p class="lead">你撐了 ${n} 天。</p>${statGrid(RUN.total)}<div class="sbs"><button class="pri" id="sAgain">再玩一次</button></div>`);
  $("sAgain").onclick=backToStart}
let lindaFig=null;
function finalEnding(){const s=RUN.total,r=rate(s);
  lindaFig=makeFigure(FIGURES.linda);lindaFig.setFace("happy");lindaFig.mode="wave";lindaFig.root.scale.setScalar(.82);lindaFig.root.position.set(-6.15,0,5.2);lindaFig.root.rotation.y=Math.PI*.9;scene.add(lindaFig.root);
  goTo(new THREE.Vector3(-5.6,.8,4.6),.62,2.2,1.2);
  const lines=[];if(hasTag("撞過頭"))lines.push("「頭上的包還好嗎？我會再帶他去給醫生看看。」");if(hasTag("發燒處理得好"))lines.push("「醫生說你處理得很好，幸好有你在！」");
  if(hasTag("發燒處理不當"))lines.push("「發燒的事……下次記得先量體溫、打給我喔。」");if(hasTag("奶奶不放心"))lines.push("「我媽說你們餵太少……別理她啦 😂」");
  lines.push(r===3?"「你根本是神！小麻糬好像比較喜歡你了 😳」":r===2?"「看得出來你很努力，真的謝謝你！」":"「大家都還活著，這樣就很好了 🥲」");
  showSheet(`<h2>🌞 Linda 回來了！</h2><p class="lead">Linda 睡飽了、精神飽滿地打開門，一把抱起小麻糬。</p><div class="story">${lines.map(l=>`<p>Linda：${l}</p>`).join("")}</div>
    ${statGrid(s)}<div class="title2">三天總稱號：<b>${TITLES[r]}</b> ${stars(r)}</div>
    ${RUN.tips.length?`<details class="tips" open><summary>📚 這三天學到的事（${RUN.tips.length}）</summary><ul>${RUN.tips.map(t=>`<li>${t}</li>`).join("")}</ul></details>`:""}
    <div class="sbs"><button class="pri" id="sAgain">再玩一次（換個角色試試）</button></div>`,"side");
  setStep("sheet");$("sAgain").onclick=backToStart}
function backToStart(){hideSheet();newRun();resetPlay();setStep("intro");focus("exterior")}
function showSheet(html,cls=""){const el=$("sheet");el.className=cls;$("sheetB").innerHTML=html;el.scrollTop=0}
function hideSheet(){$("sheet").className="";$("sheetB").innerHTML=""}


const L=(a,b,k)=>a+(b-a)*k,C1=new THREE.Color(),C2=new THREE.Color();
function updateLight(dt){updateClock(dt);nightK+=(night-nightK)*Math.min(1,dt*2.5);const k=nightK;
  hemi.intensity=L(.95,.28,k);hemi.color.copy(C1.set(0xFFF7EE).lerp(C2.set(0x9AA4D0),k));
  sun.intensity=L(1.55,.35,k);sun.color.copy(C1.set(0xFFF0DD).lerp(C2.set(0xFFB27A),k));fill.intensity=L(.35,.12,k);
  renderer.toneMappingExposure=L(1.15,1.0,k);
  GLASS.emissive.copy(C1.set(0xEAF5FB).lerp(C2.set(0x34406A).lerp(C1.clone().set(0xFFC27A),1-roofK),k));GLASS.emissiveIntensity=L(.55,.7,k);
  LAMPS.forEach(o=>o.l.intensity=o.power*k);EMIS.forEach(o=>o.m.emissiveIntensity=L(o.day,o.night,k));GLOWS.forEach(o=>o.sp.material.opacity=L(o.day,o.night,k))}

// =====================================================================
//  每一格畫面
// =====================================================================
const clock=new THREE.Clock();setCam(new THREE.Vector3(0,0,1.2),ROOMS.exterior.az,POL,.82);focus("exterior");
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(tween){tween.k=Math.min(1,tween.k+dt/tween.dur);const e=1-Math.pow(1-tween.k,3),a=tween.a,b=tween.b;
    setCam(a.t.clone().lerp(b.t,e),L(a.az,b.az,e),L(a.pol,b.pol,e),L(a.zoom,b.zoom,e));controls.enabled=tween.k>=1;if(tween.k>=1)tween=null}
  else controls.update();
  updateGame(dt,t);tutTick();
  updateWalls(dt);updateLight(dt);
  animArrows(t);storyTick(dt);if(lindaFig)lindaFig.update(dt);if(player)player.update(dt*(typeof G!=="undefined"&&G.running?1.5:1));if(FLOW.step==="select")renderSelect(dt);
  mobile.rotation.y=t*.4;bhead.rotation.z=Math.sin(t*1.6)*.12;barms[0].rotation.x=Math.sin(t*3)*.5-.3;barms[1].rotation.x=-Math.sin(t*3)*.5-.3;
  if(water.visible)duck.position.y=.48+Math.sin(t*2)*.01;
  renderer.render(scene,camera)}
frame();

</script>
